name: PostgreSQL foundation

on:
  push:
    branches: [master, docs/target-architecture-spec]
  pull_request:
    branches: [master]

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medarchive
          POSTGRES_USER: medarchive
          POSTGRES_PASSWORD: medarchive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medarchive -d medarchive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MEDARCHIVE_DATABASE_URL: postgresql+asyncpg://medarchive:medarchive@localhost:5432/medarchive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply Alembic schema
        run: alembic upgrade head
      - name: Verify Alembic revision
        run: alembic current
      - name: Run application tests
        run: pytest -q
