name: PostgreSQL foundation

on:
  push:
    branches: [master, docs/target-architecture-spec, feature/ux-implementation]
  pull_request:
    branches: [master, feature/ux-implementation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medarchive
          POSTGRES_USER: medarchive
          POSTGRES_PASSWORD: medarchive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medarchive -d medarchive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MEDARCHIVE_DATABASE_URL: postgresql+asyncpg://medarchive:medarchive@localhost:5432/medarchive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-python312.txt -e '.[dev]'
      - name: Install Chromium for browser checks
        run: python -m playwright install --with-deps chromium
      - name: Apply Alembic schema
        run: alembic upgrade head
      - name: Verify Alembic revision
        run: alembic current
      - name: Verify core tables exist
        run: |
          psql "postgresql://medarchive:medarchive@localhost:5432/medarchive" -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.cards') IS NOT NULL AND to_regclass('public.shipments') IS NOT NULL AND to_regclass('public.domain_events') IS NOT NULL AND to_regclass('public.auth_login_throttles') IS NOT NULL AS schema_ready" | grep -qx t
      - name: I00 read-only PostgreSQL baseline inventory
        run: |
          psql "postgresql://medarchive:medarchive@localhost:5432/medarchive" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          SELECT current_database(), current_user, current_setting('server_version');
          SELECT current_setting('server_version_num')::integer BETWEEN 160000 AND 169999 AS pg16;
          SELECT version_num FROM alembic_version;
          SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolcanlogin FROM pg_roles WHERE rolname = current_user;
          SELECT schemaname, tablename, tableowner FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;
          SELECT c.relname, c.relacl FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','S') ORDER BY c.relname;
          SELECT conrelid::regclass, conname, contype, convalidated FROM pg_constraint WHERE connamespace='public'::regnamespace ORDER BY 1,2;
          SELECT event_object_table, trigger_name, event_manipulation FROM information_schema.triggers WHERE trigger_schema='public' ORDER BY 1,2,3;
          SELECT relname, n_live_tup AS estimated_rows FROM pg_stat_user_tables ORDER BY relname;
          SELECT p.oid::regprocedure, pg_get_functiondef(p.oid) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prokind='f' ORDER BY 1;
          SELECT tgrelid::regclass, tgname, pg_get_triggerdef(oid) FROM pg_trigger WHERE NOT tgisinternal AND tgrelid IN (SELECT oid FROM pg_class WHERE relnamespace='public'::regnamespace) ORDER BY 1,2;
          SELECT format('SELECT %L AS relation, count(*) AS exact_rows FROM %I.%I;', tablename, schemaname, tablename) FROM pg_tables WHERE schemaname='public' ORDER BY tablename
          \gexec
          COMMIT;
          SQL
          python --version
          python -m pip check
          python -m pip freeze
      - name: I01 verify technical principal bootstrap
        run: |
          url="postgresql://medarchive:medarchive@localhost:5432/medarchive"
          psql "$url" -X -v ON_ERROR_STOP=1 -f db/postgresql/bootstrap-principals.sql
          psql "$url" -X -v ON_ERROR_STOP=1 -f db/postgresql/bootstrap-principals.sql
          psql "$url" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $i01$
          BEGIN
            IF (SELECT count(*) FROM pg_roles WHERE rolname IN ('medarchive_owner','medarchive_migrator','medarchive_runtime','medarchive_backup')) <> 4 THEN
              RAISE EXCEPTION 'Missing technical principal';
            END IF;
            IF has_schema_privilege('medarchive_runtime','public','CREATE') OR pg_has_role('medarchive_runtime','medarchive_owner','SET') OR pg_has_role('medarchive_backup','medarchive_owner','SET') OR NOT pg_has_role('medarchive_migrator','medarchive_owner','SET') OR pg_has_role('medarchive_migrator','medarchive_owner','USAGE') THEN
              RAISE EXCEPTION 'Unexpected effective privilege';
            END IF;
          END $i01$;
          SET SESSION AUTHORIZATION medarchive_runtime;
          DO $i01$
          BEGIN
            BEGIN
              CREATE TABLE public.i01_forbidden(id integer);
              RAISE EXCEPTION 'Runtime DDL unexpectedly allowed';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END $i01$;
          RESET SESSION AUTHORIZATION;
          SQL
      - name: I01 verify independent technical logins
        run: |
          admin="postgresql://medarchive:medarchive@localhost:5432/medarchive"
          # Disposable CI service only; these credentials are never used in deployment.
          psql "$admin" -X -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE medarchive_migrator PASSWORD 'ci-migrator-only';
          ALTER ROLE medarchive_runtime PASSWORD 'ci-runtime-only';
          ALTER ROLE medarchive_backup PASSWORD 'ci-backup-only';
          GRANT CONNECT ON DATABASE medarchive TO medarchive_migrator, medarchive_runtime, medarchive_backup;
          SQL
          migrator="postgresql://medarchive_migrator:ci-migrator-only@localhost:5432/medarchive"
          runtime="postgresql://medarchive_runtime:ci-runtime-only@localhost:5432/medarchive"
          backup="postgresql://medarchive_backup:ci-backup-only@localhost:5432/medarchive"
          psql "$migrator" -X -v ON_ERROR_STOP=1 -Atc "SET ROLE medarchive_owner; SELECT current_user = 'medarchive_owner' AND session_user = 'medarchive_migrator'" | grep -qx t
          for role in runtime backup; do
            url="${!role}"
            psql "$url" -X -v ON_ERROR_STOP=1 -Atc "SELECT current_user = 'medarchive_$role' AND session_user = current_user" | grep -qx t
            if psql "$url" -X -v ON_ERROR_STOP=1 -c "SET ROLE medarchive_owner"; then
              echo "Forbidden SET ROLE succeeded" >&2
              exit 1
            fi
          done
          if psql "$runtime" -X -v ON_ERROR_STOP=1 -c "BEGIN; CREATE TABLE public.i01_forbidden_login(id integer); ROLLBACK"; then
            echo "Forbidden runtime DDL succeeded" >&2
            exit 1
          fi
      - name: Validate operational shell scripts
        run: |
          for script in scripts/install.sh scripts/backup.sh scripts/pg16-client-wrapper.sh; do
            bash -n "$script"
          done
      - name: Run application tests
        run: pytest -q -rs
      - name: Verify encrypted PostgreSQL backup and restore
        env:
          MEDARCHIVE_BACKUP_DIR: ${{ runner.temp }}/medarchive-backups
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age-keygen -o "$RUNNER_TEMP/medarchive-test.agekey"
          export MEDARCHIVE_BACKUP_AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/medarchive-test.agekey")"

          # Use PostgreSQL 16 client tools to match the PostgreSQL 16 service.
          client_bin="$RUNNER_TEMP/postgresql16-client"
          mkdir -p "$client_bin"
          cp scripts/pg16-client-wrapper.sh "$client_bin/pg_dump"
          cp scripts/pg16-client-wrapper.sh "$client_bin/pg_restore"
          chmod 0755 "$client_bin/pg_dump" "$client_bin/pg_restore"
          export PATH="$client_bin:$PATH"

          # Seed old completed archives to exercise retention in the real script.
          mkdir -p "$MEDARCHIVE_BACKUP_DIR"
          umask 077
          for i in $(seq 1 26); do
            touch "$MEDARCHIVE_BACKUP_DIR/medarchive-old-$i.dump.age"
            touch -d "2000-01-01 00:00:$i UTC" "$MEDARCHIVE_BACKUP_DIR/medarchive-old-$i.dump.age"
          done

          # Refuse to continue while an old plaintext archive remains.
          touch "$MEDARCHIVE_BACKUP_DIR/medarchive-legacy.dump"
          if scripts/backup.sh; then
            echo "Backup unexpectedly accepted a plaintext legacy dump" >&2
            exit 1
          fi
          test -f "$MEDARCHIVE_BACKUP_DIR/medarchive-legacy.dump"
          rm "$MEDARCHIVE_BACKUP_DIR/medarchive-legacy.dump"

          scripts/backup.sh
          backup_count="$(find "$MEDARCHIVE_BACKUP_DIR" -maxdepth 1 -type f -name 'medarchive-*.dump.age' | wc -l)"
          test "$backup_count" -eq 24
          backup_file="$(find "$MEDARCHIVE_BACKUP_DIR" -maxdepth 1 -type f -name 'medarchive-????????T??????Z.dump.age' -print -quit)"
          test -n "$backup_file"
          test "$(stat -c '%a' "$backup_file")" = "600"
          decrypted_file="$MEDARCHIVE_BACKUP_DIR/.medarchive-restored.dump"
          age --decrypt --identity "$RUNNER_TEMP/medarchive-test.agekey" --output "$decrypted_file" "$backup_file"
          test "$(stat -c '%a' "$decrypted_file")" = "600"
          pg_restore --list "$decrypted_file" >/dev/null
          export PGPASSWORD=medarchive
          createdb --host=localhost --username=medarchive medarchive_restore_check
          pg_restore --no-owner --no-acl --exit-on-error --host=localhost --username=medarchive --dbname=medarchive_restore_check "$decrypted_file"
          psql "postgresql://medarchive:medarchive@localhost:5432/medarchive_restore_check" -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.domain_events') IS NOT NULL AND to_regclass('public.shipments') IS NOT NULL" | grep -qx t
          dropdb --host=localhost --username=medarchive medarchive_restore_check
          rm -f "$decrypted_file" "$RUNNER_TEMP/medarchive-test.agekey"
