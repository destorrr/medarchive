const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=id=>people.find(x=>x.id===id);const btn=(s,js,cls='')=>`<button class="${cls}" onclick="${js}">${s}</button>`;const tag=s=>`<span class="tag">${esc(s)}</span>`;const stateName=s=>({draft:'Черновик',submitted:'Отправлена в архив',processing:'Обрабатывается',completed:'Завершена',cancelled:'Отменена'})[s]||s;const ownDraft=()=>requests.find(r=>r.state==='draft'&&r.author===ME);const cardRow=id=>{const x=p(id);return x?`<b>${esc(x.id)}</b> · ${esc(x.name)} · ${esc(x.birth)}`:esc(id)};const availableArchive=()=>people.filter(x=>x.owner==='archive');const availableCO=()=>people.filter(x=>x.owner==='co'&&!x.external&&!boxes.some(b=>b.cards.includes(x.id)));
const day=s=>s?s.slice(6,10)+'-'+s.slice(3,5)+'-'+s.slice(0,2):'';const inPeriod=(created,f)=>{let d=day(created);return(!f.from||d>=f.from)&&(!f.to||d<=f.to)};const timeline=events=>`<div class="timeline">${[...events].reverse().map(e=>`<div class="event"><small>${esc(e[0])} · ${esc(e[2])}</small><div>${esc(e[1])}</div></div>`).join('')}</div>`;
function filterBar(type,showMode=true){let f=filters[type];let opts=type==='requests'?[['active','Без отменённых'],['all','Все, включая отменённые'],['cancelled','Только отменённые']]:type==='incoming'?[['active','Ожидают получения'],['all','Все отправления'],['completed','Полностью полученные']]:[['all','Все отправления'],['draft','Черновики'],['in_transit','Переданные']];return `<div class="filters"><label>Созданы с<input type="date" value="${f.from}" onchange="setFilter('${type}','from',this.value)"></label><label>По<input type="date" value="${f.to}" onchange="setFilter('${type}','to',this.value)"></label>${showMode?`<label>Показывать<select onchange="setFilter('${type}','mode',this.value)">${opts.map(([v,t])=>`<option value="${v}" ${f.mode===v?'selected':''}>${t}</option>`).join('')}</select></label>`:''}${btn('Сбросить период',`clearDates('${type}')`)}</div>`}
function setFilter(t,k,v){filters[t][k]=v;render()}function clearDates(t){filters[t].from='';filters[t].to='';render()}function card(title,body){return `<div class="panel"><h2>${title}</h2>${body}</div>`}function nav(){const link=(v,n)=>btn(n,`go('${v}')`,v===view?'active':'');document.getElementById('nav').innerHTML='<h3>Центральный офис</h3>'+link('home','Главная')+link('cards','Карты ЦО')+'<div class="nav-section"><div class="nav-section-title">Заявки на карты из архива</div>'+link('requests','Заявки в архив')+link('incoming','Получение карт')+'</div><div class="nav-section"><div class="nav-section-title">Отправка коробок в архив</div>'+link('boxes','Отправка коробок')+link('outgoing','Отправления')+'</div><p><small>Без сервера · учебные события</small></p>'}

function render(){nav();let h='';if(view==='home'){let work=requests.filter(r=>['submitted','processing'].includes(r.state)).length,inc=requests.filter(r=>r.handed&&receiptSent(r).some(id=>!r.received.includes(id))).length,drafts=shipments.filter(s=>s.state==='draft').length,transit=shipments.filter(s=>s.state==='in_transit').length;h=card('Главная',`<p class="muted">Текущие задачи Центрального офиса. Нажмите на показатель, чтобы открыть соответствующий список.</p><div class="grid3"><div class="statcard" role="button" tabindex="0" onclick="homeGo('requests')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();homeGo('requests')}"><div class="stat">${work}</div><b>Заявки в архиве</b><small>Отправлены и находятся в обработке</small></div><div class="statcard" role="button" tabindex="0" onclick="homeGo('incoming')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();homeGo('incoming')}"><div class="stat">${inc}</div><b>Входящие отправления</b><small>Есть карты, получение которых ещё не подтверждено</small></div><div class="statcard" role="button" tabindex="0" onclick="homeGo('outgoing')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();homeGo('outgoing')}"><div class="stat">${drafts}</div><b>Черновики отправлений</b><small>Коробки подготовлены, передача курьеру ожидается</small></div><div class="statcard" role="button" tabindex="0" onclick="homeGo('outgoingSent')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();homeGo('outgoingSent')}"><div class="stat">${transit}</div><b>Отправлено в архив</b><small>Коробки переданы курьеру, ожидается приёмка</small></div></div>`) }
if(view==='requests'){let f=filters.requests,rs=requests.filter(r=>(r.state!=='draft'||r.author===ME)&&inPeriod(r.created,f)&&(f.mode==='all'||(f.mode==='active'?r.state!=='cancelled':r.state==='cancelled')));h=card('Заявки на карты из архива',`<div class="row between"><p class="muted">Заявки создаёт ЦО. Черновик виден только автору.</p>${btn(ownDraft()?'Продолжить черновик':'Создать заявку','createDraft()','primary')}</div>${filterBar('requests')}<div class="scroll"><table><thead><tr><th>Номер</th><th>Создана (время сервера*)</th><th>Автор</th><th>Карт</th><th>Статус</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.created)}</td><td>${esc(users[r.author])}</td><td>${r.cards.length}</td><td>${tag(stateName(r.state))}</td><td>${btn('Открыть',`go('request','${r.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">По выбранным фильтрам заявок нет.</td></tr>'}</tbody></table></div>`)}

if(view==='incoming'){let f=filters.incoming,rr=requests.filter(r=>r.handed&&inPeriod(r.shipmentCreated,f)&&(f.mode==='all'||(f.mode==='active'?receiptSent(r).some(id=>!r.received.includes(id)):receiptSent(r).every(id=>r.received.includes(id)))));h=card('Получение карт из архива',`<p class="muted">Все подготовленные карты переданы одним отправлением. Получение можно подтверждать выбранными картами.</p>${filterBar('incoming')}<div class="scroll"><table><thead><tr><th>Отправление</th><th>Создано (время сервера*)</th><th>Заявка</th><th>Получено</th><th>Статус</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td>${r.shipment}</td><td>${esc(r.shipmentCreated)}</td><td>${r.id}</td><td>${r.received.length} из ${receiptSent(r).length}</td><td>${tag(incomingState(r))}</td><td>${btn('Открыть отправление',`go('receipt','${r.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">Нет отправлений по фильтрам.</td></tr>'}</tbody></table></div>`)}
if(view==='receipt'){let r=requests.find(x=>x.id===selected);if(!r||!r.handed){go('incoming');return}let sent=receiptSent(r),waiting=sent.filter(id=>!r.received.includes(id));h=card(`Отправление ${esc(r.shipment)}`,`${btn('← К отправлениям',"go('incoming')")}<p><b>Создано:</b> ${esc(r.shipmentCreated)} · <b>Заявка:</b> <a href="#" onclick="event.preventDefault();go('request','${r.id}')">${r.id}</a> · ${tag(incomingState(r))}</p><p>Передано курьеру: ${sent.length} карт одним отправлением. Получено: ${r.received.length}. Ожидается: ${waiting.length}.</p><div class="actions">${btn('Выбрать все ожидающие','selectAllReceipt()')}${btn('Снять выбор','clearReceipt()')}</div>${sent.map(id=>`<div class="item"><label>${r.received.includes(id)?'✓':`<input type="checkbox" ${selectedReceipt.includes(id)?'checked':''} onchange="toggleReceipt('${id}',this.checked)">`} ${cardRow(id)} · ${tag(r.received.includes(id)?'Получена':'В пути')} · Ответственность: ${r.received.includes(id)?'ЦО':'курьер'}</label></div>`).join('')}<div class="actions">${btn(`Подтвердить получение выбранных (${selectedReceipt.length})`,'receive()','primary')}</div><p class="muted">Отмечайте только фактически поступившие карты. До подтверждения получения каждой карты ответственность несёт курьер. Полученные карты переходят под ответственность ЦО.</p><h3>Хронология</h3>${timeline(r.events.filter(e=>e[1].includes('Получена')||e[1].includes('Отправление')||e[1].includes('Заявка завершена')))}`)}
if(view==='cards'){let f=filters.cards,cs=people.filter(x=>x.owner==='co'&&(f.mode==='all'||(f.mode==='external'?x.external:f.mode==='transit'?cardStatus(x).startsWith('В пути'):!x.external&&!cardStatus(x).startsWith('В пути'))));h=card('Реестр карт на балансе ЦО',`<p class="muted">Карты, за которые отвечает ЦО. Выберите карты для оформления внешнего хранения.</p><div class="filters"><label>Статус хранения<select onchange="setFilter('cards','mode',this.value)"><option value="all" ${f.mode==='all'?'selected':''}>Все</option><option value="local" ${f.mode==='local'?'selected':''}>В ЦО</option><option value="external" ${f.mode==='external'?'selected':''}>На внешнем хранении</option><option value="transit" ${f.mode==='transit'?'selected':''}>В пути в архив</option></select></label></div><div class="scroll"><table><thead><tr><th>Выбор</th><th>Номер</th><th>ФИО</th><th>Дата рождения</th><th>Принята на баланс</th><th>Местонахождение</th><th>Действие</th></tr></thead><tbody>${cs.map(x=>`<tr><td><input type="checkbox" aria-label="Выбрать ${x.id}" ${x.external||cardStatus(x).startsWith('В пути')||!!outboundBoxFor(x.id)?'disabled':''} ${selectedCards.includes(x.id)?'checked':''} onchange="toggleCard('${x.id}',this.checked)"></td><td><button class="plain-link" onclick="go('card','${x.id}')">${x.id}</button></td><td>${esc(x.name)}</td><td>${x.birth}</td><td>${esc(x.receivedAt)}</td><td>${tag(cardStatus(x))}</td><td>${x.external?btn('Вернуть',`returnExternal('${x.id}')`):'—'}</td></tr>`).join('')}</tbody></table></div><div class="actions">${btn(`Оформить внешнее хранение (${selectedCards.length})`,'externalize()','primary')}</div>${externalFormOpen?externalForm():''}${notice?`<div class="notice">${esc(notice)}</div>`:''}`)}
if(view==='card'){let x=p(selected);if(!x||x.owner!=='co'){go('cards');return}h=card(`Карта ${x.id}`,`${btn('← К реестру',"go('cards')")}<p><b>Пациент:</b> ${esc(x.name)}</p><p><b>Дата рождения:</b> ${x.birth}</p><p><b>Принята на баланс ЦО:</b> ${esc(x.receivedAt)}</p><p><b>Местонахождение:</b> ${tag(cardStatus(x))}</p><p><b>Ответственный:</b> ${esc(cardCustody(x))}</p>${x.externalHistory?.length?`<h3>История внешнего хранения</h3>${x.externalHistory.map(h=>`<div class="item">${esc(h.target)} · передана ${esc(h.sentAt||'—')} · возвращена ${esc(h.returnedAt)}<p>${esc(h.returnComment)}</p></div>`).join('')}`:''}${x.external?`<p><b>Куда передана:</b> ${esc(x.externalTarget||"Не указано в учебных данных")}</p><p><b>Подробности:</b> ${esc(x.externalComment||"—")}</p>`:""}${x.external?btn('Снять с внешнего хранения',`returnExternal('${x.id}')`,'primary'):!outboundBoxFor(x.id)?btn('Оформить внешнее хранение этой карты',`externalizeOne('${x.id}')`,'primary'):'<p class="muted">Карта находится в коробке или отправлении; внешнее хранение недоступно.</p>'}${externalFormOpen?externalForm():''}`)}
if(view==='boxes'){h=card('Отправка коробок из ЦО в архив',`<p class="muted">Создание и наполнение коробок. Добавлять можно только карты на балансе ЦО, не находящиеся на внешнем хранении. Новые карты здесь не создаются.</p><div class="actions">${btn('Создать коробку','createBox()','primary')}${btn('К списку отправлений',"go('outgoing')")}</div><h3>Коробки</h3>${boxes.filter(b=>b.state!=='written_off').map(b=>`<div class="item row between"><div><b>${b.id}</b> · ${tag(b.state==='free'?'Свободна':b.state==='draft'?'В черновике':b.state==='received'?'Принята архивом':'Передана')} · ${b.cards.length} карт<br><small>Создана: ${b.created}</small></div><div>${btn('Открыть',`go('box','${b.id}')`)} ${b.state==='free'&&!b.cards.length?btn('Списать',`writeOffBox('${b.id}')`):''}</div></div>`).join('')}<h3>Подготовка отправления</h3><p>Отметьте непустые свободные коробки, выберите курьера и создайте черновик.</p>${boxes.filter(b=>b.state==='free'&&b.cards.length).map(b=>`<div class="item"><label><input type="checkbox" ${boxSelection.includes(b.id)?'checked':''} onchange="toggleBox('${b.id}',this.checked)"> ${b.id} · ${b.cards.length} карт</label></div>`).join('')||'<p class="muted">Нет наполненных свободных коробок.</p>'}<div class="row"><label>Курьер <select id="courier"><option>Курьер 1</option><option>Курьер 2</option></select></label>${btn('Создать черновик отправления','createShipment()','primary')}</div>${notice?`<div class="notice">${esc(notice)}</div>`:''}`)}
if(view==='box'){let b=boxes.find(x=>x.id===selected);if(!b){go('boxes');return}h=card('Наполнение коробки',`<div class="box-workspace"><div class="box-heading">${btn('← Ко всем коробкам',"go('boxes')")}<strong>${esc(b.id)}</strong><span class="box-count">${b.cards.length} карт</span></div>${b.state==='free'?boxSearchUI():`<p>${tag(b.state==='draft'?'В черновике':b.state==='received'?'Принята архивом':'Передана курьеру')} · состав заблокирован</p>`}<h3>Состав коробки</h3>${b.cards.map(id=>`<div class="item row between"><span>${cardRow(id)}</span>${b.state==='free'?btn('Убрать из коробки',`removeFromBox('${id}')`):''}</div>`).join('')||'<p class="muted">Коробка пуста.</p>'}<p class="muted"><small>Создана: ${esc(b.created)} · учебное серверное время</small></p></div>` )}
if(view==='outgoing'){let f=filters.outgoing,ss=shipments.filter(s=>inPeriod(s.created,f)&&(f.mode==='all'||s.state===f.mode));h=card('Отправления коробок в архив',`${btn('← К коробкам',"go('boxes')")}${filterBar('outgoing')}<div class="scroll"><table><thead><tr><th>Номер</th><th>Создано (время сервера*)</th><th>Коробки</th><th>Курьер</th><th>Статус</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${s.id}</td><td>${s.created}</td><td>${s.boxes.join(', ')}</td><td>${esc(s.courier)}</td><td>${tag(s.state==='cancelled'?'Отменено':s.state==='draft'?'Черновик':s.state==='received'?'Получено архивом':s.state==='partially_received'?'Частично получено архивом':'Передано курьеру')}</td><td>${btn('Открыть',`go('outshipment','${s.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">Отправлений пока нет.</td></tr>'}</tbody></table></div>`)}
if(view==='outshipment'){let s=shipments.find(x=>x.id===selected);if(!s){go('outgoing');return}h=card(`Отправление ${s.id}`,`${btn('← К отправлениям',"go('outgoing')")}<p><b>Создано:</b> ${s.created} · <b>Курьер:</b> ${esc(s.courier)} · ${tag(s.state==='cancelled'?'Отменено':s.state==='draft'?'Черновик':s.state==='received'?'Получено архивом':s.state==='partially_received'?'Частично получено архивом':'Передано курьеру')}</p><h3>Коробки</h3>${s.boxes.map(id=>{let b=boxes.find(b=>b.id===id);return `<div class="item row between"><span>${id} · ${b?.cards.length||0} карт · ${b?.state==='received'?'Принята архивом':b?.state==='in_transit'?'В пути':'В ЦО'}</span>${b?.state==='in_transit'?btn('Имитировать приёмку архивом',`simulateArchiveReceipt('${id}')`):''}</div>`}).join('')}<p class="muted">Учебная имитация приёмки — только для проверки сквозного сценария; в реальной системе приёмку выполняет сотрудник архива.</p><div class="actions">${s.state==='draft'?btn('Передать курьеру','handover()','primary')+btn('Отменить черновик','cancelShipment()'):''}</div><h3>Хронология</h3>${timeline(s.events)}`)}
document.getElementById('screen').innerHTML=h;if(view==='box'){requestAnimationFrame(()=>{const input=document.getElementById('scan');if(input&&!input.disabled)input.focus({preventScroll:true})})}}
function requestSearchUI(){return `<div class="actions">${btn('Найти карту по ФИО','toggleSearch()','primary')}</div>${searchMode?`<div class="searchpane"><label><b>Поиск карты по ФИО или его части</b><input style="display:block;width:100%;margin-top:10px" id="search" placeholder="Введите фамилию" value="${esc(query)}" oninput="query=this.value;showMatches('request')"></label><div class="search-results" id="matches"></div></div>`:''}<p class="muted">В поиск входят только карты на балансе архива, в том числе принятые без размещения.</p>`}
function boxSearchUI(){return `<div class="scan-panel"><strong>▣ Сканируйте QR медицинской карты</strong><div class="qr-entry"><input class="qr" id="scan" aria-label="Поле приёма QR-кода" autocomplete="off" placeholder="Поле сканирования — готово к считыванию" onkeydown="if(event.key==='Enter'){event.preventDefault();scanCard('box')}"></div></div><div class="actions">${btn('Найти карту по ФИО','toggleSearch()')}</div>${searchMode?`<div class="searchpane"><label><b>Поиск по ФИО или его части</b><input style="display:block;width:100%;margin-top:10px" id="search" placeholder="Введите фамилию" value="${esc(query)}" oninput="query=this.value;showMatches('box')"></label><div class="search-results" id="matches"></div></div>`:''}`}
function externalForm(){return `<div class="external-form"><h3>Оформление внешнего хранения</h3><p class="muted">Выбрано карт: ${selectedCards.length}. Укажите получателя и подробности передачи.</p><label>Куда переданы карты *<select id="external-target"><option value="">Выберите из справочника</option><option value="Суд">Суд</option><option value="Страховая компания">Страховая компания</option><option value="Другая организация">Другая организация</option></select></label><label>Комментарий с подробностями *<textarea id="external-comment" placeholder="Укажите организацию, основание, реквизиты и обстоятельства передачи"></textarea></label><div class="actions">${btn('Подтвердить внешнее хранение','confirmExternal()','primary')}${btn('Отмена','cancelExternal()')}</div></div>`}
function toggleSearch(){searchMode=!searchMode;query='';render()}function showMatches(context){let e=document.getElementById('matches');if(!e)return;let q=query.trim().toLocaleLowerCase('ru').replace(/ё/g,'е');let source=context==='request'?availableArchive():availableCO();e.innerHTML=q.length<2?'<p class="muted">Введите не менее двух символов ФИО.</p>':source.filter(x=>x.name.toLocaleLowerCase('ru').replace(/ё/g,'е').includes(q)).map(x=>`<div class="item row between"><span>${cardRow(x.id)}${context==='request'&& !x.placed?' · Принята без размещения':''}</span>${btn(context==='request'?'Добавить в заявку':'Добавить в коробку',`addFound('${context}','${x.id}')`,'primary')}</div>`).join('')||'<p class="muted">Подходящих карт нет.</p>'}
function scanCard(context){let el=document.getElementById('scan');let raw=el.value.trim();let match=raw.match(/MC-\d+/i);let id=match?match[0].toUpperCase():raw.toUpperCase();let source=context==='request'?availableArchive():availableCO();if(!source.some(x=>x.id===id)){alert('Карта не найдена среди доступных карт '+(context==='request'?'архива.':'ЦО без внешнего хранения.'));return}addFound(context,id)}function addFound(context,id){if(context==='request'){let r=ownDraft();if(!r||!availableArchive().some(x=>x.id===id))return;if(!r.cards.includes(id))r.cards.push(id)}else{let b=boxes.find(x=>x.id===selected);if(!b||b.state!=='free'||!availableCO().some(x=>x.id===id))return;b.cards.push(id)}searchMode=false;query='';render();if(context==='box')document.getElementById('scan')?.focus()}
function demoTime(){return new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','')}function createDraft(){let r=ownDraft();if(!r){r={id:'P09-'+sequence++,author:ME,created:demoTime(),state:'draft',cards:[],results:{},shipment:null,received:[],handed:false,events:[[demoTime(),'Заявка создана',users[ME]]]};requests.push(r)}go('request',r.id)}function removeCard(id){let r=ownDraft();if(r){r.cards=r.cards.filter(x=>x!==id);render()}}function submitDraft(){let r=ownDraft();if(!r||!r.cards.length)return alert('Добавьте карты.');if(!confirm('Отправить заявку в архив? Состав нельзя будет изменить.'))return;r.state='submitted';r.events.push([NOW,'Отправлена в архив',users[ME]]);render()}function cancelDraft(){let r=ownDraft();if(!r||!confirm('Отменить черновик?'))return;r.state='cancelled';r.events.push([NOW,'Черновик отменён',users[ME]]);go('requests')}
function toggleReceipt(id,on){selectedReceipt=on?[...new Set([...selectedReceipt,id])]:selectedReceipt.filter(x=>x!==id);render()}function selectAllReceipt(){let r=requests.find(x=>x.id===selected);selectedReceipt=receiptSent(r).filter(id=>!r.received.includes(id));render()}function clearReceipt(){selectedReceipt=[];render()}function receive(){let r=requests.find(x=>x.id===selected);if(!r||!r.handed||r.state!=='processing')return;let valid=[...new Set(selectedReceipt)].filter(id=>receiptSent(r).includes(id)&&!r.received.includes(id));if(!valid.length)return alert('Выберите фактически полученные карты.');if(!confirm(`Подтвердить получение ${valid.length} карт?`))return;r.received.push(...valid);for(let id of valid){let x=p(id);x.owner='co';x.custody='co';x.external=false;x.receivedAt=NOW;r.events.push([NOW,'Получена карта '+id,users[ME]])}if(receiptSent(r).every(id=>r.received.includes(id))){r.state='completed';r.events.push([NOW,'Заявка завершена',users[ME]])}selectedReceipt=[];render()}
function toggleCard(id,on){selectedCards=on?[...new Set([...selectedCards,id])]:selectedCards.filter(x=>x!==id);render()}function externalizeOne(id){selectedCards=[id];externalize()}function externalize(){let valid=selectedCards.filter(id=>{let x=p(id);return x&&x.owner==='co'&&!x.external&&!boxes.some(b=>b.cards.includes(id))});if(!valid.length)return alert('Выберите карты ЦО, не находящиеся на внешнем хранении и не помещённые в коробку.');selectedCards=valid;externalFormOpen=true;render()}function cancelExternal(){externalFormOpen=false;render()}
function returnExternal(id){let x=p(id);if(!x||x.owner!=='co'||!x.external)return alert('Карта не находится на внешнем хранении.');let comment=prompt('Укажите подробности возврата карты с внешнего хранения (обязательно):','');if(comment===null)return;comment=comment.trim();if(!comment)return alert('Комментарий о возврате обязателен.');if(!confirm('Подтвердить фактический возврат карты '+id+' в ЦО?'))return;x.external=false;x.externalReturnAt=NOW;x.externalReturnComment=comment;x.externalHistory=x.externalHistory||[];x.externalHistory.push({target:x.externalTarget,comment:x.externalComment,sentAt:x.externalAt,returnedAt:NOW,returnComment:comment});x.externalTarget='';x.externalComment='';selectedCards=[];message('Карта '+id+' снята с внешнего хранения. Учебная операция.');}
function confirmExternal(){let target=document.getElementById('external-target')?.value||'',comment=document.getElementById('external-comment')?.value.trim()||'';if(!target||!comment)return alert('Выберите получателя из справочника и заполните подробный комментарий.');let valid=selectedCards.filter(id=>{let x=p(id);return x&&x.owner==='co'&&!x.external&&!boxes.some(b=>b.cards.includes(id))});if(!valid.length)return alert('Выбранные карты уже недоступны для внешнего хранения.');if(!confirm(`Оформить внешнее хранение для ${valid.length} карт?`))return;valid.forEach(id=>{let x=p(id);x.external=true;x.externalTarget=target;x.externalComment=comment;x.externalAt=NOW});selectedCards=[];externalFormOpen=false;message('Оформлено внешнее хранение: '+valid.join(', ')+'. Получатель: '+target+'. Учебная операция.')}
function createBox(){let id='BX-CO-'+String(boxSequence++).padStart(2,'0');boxes.push({id,created:NOW,cards:[],state:'free'});go('box',id)}function writeOffBox(id){let b=boxes.find(x=>x.id===id);if(!b||b.state!=='free'||b.cards.length)return alert('Списать можно только пустую свободную коробку.');if(!confirm('Списать пустую коробку '+id+'?'))return;b.state='written_off';render()}function removeFromBox(id){let b=boxes.find(x=>x.id===selected);if(!b||b.state!=='free')return;b.cards=b.cards.filter(x=>x!==id);render()}function toggleBox(id,on){boxSelection=on?[...new Set([...boxSelection,id])]:boxSelection.filter(x=>x!==id);render()}function createShipment(){let chosen=boxSelection.filter(id=>{let b=boxes.find(x=>x.id===id);return b&&b.state==='free'&&b.cards.length});if(!chosen.length)return alert('Выберите непустые свободные коробки.');let courier=document.getElementById('courier')?.value||'Курьер 1';let id='SH-CO-'+String(shipmentSequence++).padStart(3,'0');shipments.push({id,created:demoTime(),boxes:chosen,courier,state:'draft',events:[[demoTime(),'Создан черновик отправления',users[ME]]]});chosen.forEach(id=>boxes.find(b=>b.id===id).state='draft');boxSelection=[];go('outshipment',id)}function handover(){let s=shipments.find(x=>x.id===selected);if(!s||s.state!=='draft')return;if(!confirm('Передать все коробки отправления курьеру?'))return;s.state='in_transit';s.boxes.forEach(id=>{let b=boxes.find(b=>b.id===id);b.state='in_transit';b.cards.forEach(cid=>{let x=p(cid);if(x)x.custody='courier'})});s.events.push([NOW,'Передано курьеру '+s.courier,users[ME]]);render()}function simulateArchiveReceipt(boxId){let s=shipments.find(x=>x.id===selected),b=boxes.find(x=>x.id===boxId);if(!s||!b||!s.boxes.includes(boxId)||b.state!=='in_transit')return alert('Приёмка недоступна.');if(!confirm('УЧЕБНАЯ ИМИТАЦИЯ: архив подтвердил получение коробки '+boxId+'? В реальной системе это действие доступно только архиву.'))return;b.state='received';b.cards.forEach(id=>{let x=p(id);if(x){x.owner='archive';x.placed=false;x.receivedArchiveAt=NOW;x.custody='archive'}});s.state=s.boxes.every(id=>boxes.find(b=>b.id===id)?.state==='received')?'received':'partially_received';s.events.push([NOW,'Учебная имитация приёмки коробки '+boxId+' архивом','Сотрудник архива (имитация)']);selectedCards=[];render()}function cancelShipment(){let s=shipments.find(x=>x.id===selected);if(!s||s.state!=='draft'||!confirm('Отменить черновик отправления?'))return;s.boxes.forEach(id=>boxes.find(b=>b.id===id).state='free');s.state='cancelled';s.events.push([demoTime(),'Черновик отменён',users[ME]]);go('outgoing')}
render();
</script></body></html>
