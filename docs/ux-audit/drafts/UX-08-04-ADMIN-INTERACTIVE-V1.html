<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Администратор · UX-08 v1</title><style>:root{font-family:'Segoe UI',Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:white;padding:19px 25px;display:flex;justify-content:space-between}main{max-width:1320px;margin:20px auto;padding:0 16px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.panel{border:1px solid #d8e4e9;background:white;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #223b4c0a}nav button{display:block;width:100%;text-align:left;margin:0 0 8px;min-height:46px}button,input,select{font:inherit}button{border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;color:#1b536d;background:white;cursor:pointer}button:hover{background:#edf6f8}button.primary{background:#116d7b;color:white}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}input,select{padding:9px;border:1px solid #c0d1dc;border-radius:8px;max-width:100%}h1{font-size:25px;margin:0 0 15px}h2{font-size:19px}.muted,small{color:#667d8b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid #d8e4e9;border-radius:11px;padding:20px;cursor:pointer;background:#f9fcfd}.tile:hover{background:#edf8fa}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #e5edf0;padding:11px 8px;text-align:left}th{font-size:13px;color:#667d8b}.tag{border-radius:20px;padding:5px 10px;background:#eaf3f6;font-size:13px}.warn{background:#fff4df;padding:12px;border-radius:9px;margin:12px 0}.ok{background:#e5f5ed;padding:12px;border-radius:9px;margin:12px 0}.field{display:grid;gap:5px;margin:12px 0;max-width:460px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.scroll{overflow-x:auto}button:focus-visible,input:focus-visible{outline:3px solid #e5a852}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{width:auto}header{flex-direction:column;gap:10px}}</style></head><body><header><div><b>МедАрхив</b> · Администрирование</div><small style="color:#d5e6ec">UX-08-04 · интерактивный черновик v1 · демонстрационные данные</small></header><main><div class="layout"><nav class="panel" id="nav"></nav><section id="screen"></section></div></main><script>
const menu=[['home','Главная'],['users','Пользователи'],['org','Организация'],['couriers','Курьеры'],['shelves','Структура архива'],['search','Поиск объектов'],['audit','Аудит безопасности']];let view='home',selected=null,tab='profile',q='',note='',filter='all';const me='u1';let users=[{id:'u1',name:'Администратор системы',login:'admin',role:'admin',location:'—',active:true,correct:false},{id:'u2',name:'Иванова Мария Петровна',login:'ivanova',role:'branch',location:'Филиал №1',active:true,correct:false},{id:'u3',name:'Петров Алексей Игоревич',login:'petrov',role:'archive',location:'Архив',active:true,correct:true},{id:'u4',name:'Соколова Анна Сергеевна',login:'sokolova',role:'central_office',location:'ЦО',active:false,correct:false}];let org=[{id:'o1',name:'Филиал №1',type:'Филиал',active:true},{id:'o2',name:'ЦО',type:'Центральный офис',active:true},{id:'o3',name:'Архив',type:'Архив',active:true}];let couriers=[{id:'c1',name:'Кузнецов Сергей Павлович',active:true},{id:'c2',name:'Орлов Игорь Николаевич',active:false}];let shelves=[{id:'s1',section:'Секция А',name:'А-01',boxes:3,active:true},{id:'s2',section:'Секция А',name:'А-02',boxes:0,active:true},{id:'s3',section:'Секция Б',name:'Б-01',boxes:0,active:false}];let events=[['24.11.2026 10:30','Назначение card_correct','Администратор системы','Петров Алексей Игоревич','Успешно']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,fn,cls='')=>'<button class="'+cls+'" onclick="'+fn+'">'+esc(t)+'</button>';const badge=x=>'<span class="tag">'+(x?'Активен':'Неактивен')+'</span>';const panel=(title,body)=>'<div class="panel"><h1>'+title+'</h1>'+body+'</div>';function go(v,id=null){view=v;selected=id;tab='profile';q='';note='';render()}function notify(t){note=t;render()}function log(type,target){events.unshift(['24.11.2026 12:00',type,'Администратор системы',target,'Успешно'])}function nav(){document.getElementById('nav').innerHTML='<h3>Администратор</h3>'+menu.map(([id,t])=>btn(t,"go('"+id+"')",id===view?'active':'')).join('')+'<p><small>Учебные данные · без сервера</small></p>'}function list(items,cols,actions){return '<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'<th>Действие</th></tr></thead><tbody>'+items.map(x=>'<tr>'+actions(x)+'</tr>').join('')+'</tbody></table></div>'}function searchbar(){return '<div class="row"><input aria-label="Поиск" placeholder="Поиск по названию или ФИО" value="'+esc(q)+'" oninput="q=this.value;render()"><select onchange="filter=this.value;render()"><option value="all">Все статусы</option><option value="active" '+(filter==='active'?'selected':'')+'>Активные</option><option value="inactive" '+(filter==='inactive'?'selected':'')+'>Неактивные</option></select></div>'}function filtered(items){return items.filter(x=>(filter==='all'||x.active===(filter==='active'))&&(x.name+' '+(x.login||'')).toLowerCase().includes(q.toLowerCase()))}function field(t,id,val){return '<label class="field">'+t+'<input id="'+id+'" value="'+esc(val)+'"></label>'}function updateUser(){let u=users.find(x=>x.id===selected);if(u.id===me)return notify('Изменение собственного профиля запрещено');let name=document.getElementById('uname').value.trim(),role=document.getElementById('urole').value,location=document.getElementById('uloc').value;if(!name)return notify('ФИО обязательно');if(role==='admin'&&!confirm('Подтвердите назначение роли администратора. В рабочей системе требуется повторный ввод действующего пароля.'))return;u.name=name;u.role=role;u.location=role==='admin'?'—':location;log('Изменение профиля',u.name);notify('Демонстрация: профиль обновлён')}function toggleUser(){let u=users.find(x=>x.id===selected);if(u.id===me)return notify('Самодеактивация запрещена');if(u.role==='admin'&&u.active&&users.filter(x=>x.role==='admin'&&x.active).length===1)return notify('Нельзя отключить последнего активного администратора');if(!confirm('Подтвердить изменение активности?'))return;u.active=!u.active;log('Изменение активности',u.name);notify('Статус изменён')}function correct(){let u=users.find(x=>x.id===selected);if(u.id===me||!u.active)return notify('Самоназначение и назначение неактивному сотруднику запрещены');u.correct=!u.correct;log(u.correct?'Назначение card_correct':'Отзыв card_correct',u.name);notify('Право обновлено')}function resetPassword(){let u=users.find(x=>x.id===selected);if(u.id===me)return notify('Сброс собственного пароля здесь запрещён');let p=prompt('Демонстрация: повторный ввод собственного пароля администратора. Пароль не сохраняется.');if(!p)return notify('Сброс отменён: подтверждение обязательно');notify('Демонстрация проверки: реальный сброс пароля и отзыв сессий не выполняются без сервера')}function userScreen(){if(!selected)return panel('Пользователи',searchbar()+'<p>'+btn('Добавить сотрудника',"go('newuser')",'primary')+'</p>'+list(filtered(users),['ФИО','Логин','Роль','Локация','Статус'],u=>'<td>'+esc(u.name)+'</td><td>'+esc(u.login)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.location)+'</td><td>'+badge(u.active)+'</td><td>'+btn('Открыть',"go('users','"+u.id+"')")+'</td>'));let u=users.find(x=>x.id===selected);let tabs=[['profile','Профиль'],['rights','Полномочия'],['security','Безопасность'],['history','История изменений']];let h=btn('← К списку',"go('users')")+'<h2>'+esc(u.name)+'</h2>'+badge(u.active)+'<div class="tabs">'+tabs.map(([v,t])=>btn(t,"tab='"+v+"';render()",tab===v?'active':'')).join('')+'</div>';if(tab==='profile')h+=field('ФИО','uname',u.name)+'<p>Логин: <b>'+esc(u.login)+'</b> (неизменяемый)</p><label class="field">Роль<select id="urole">'+['branch','archive','central_office','admin'].map(r=>'<option '+(r===u.role?'selected':'')+'>'+r+'</option>').join('')+'</select></label><label class="field">Организационная привязка<select id="uloc">'+org.filter(x=>x.active).map(x=>'<option '+(x.name===u.location?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'+btn('Сохранить изменения','updateUser()','primary')+' '+btn(u.active?'Деактивировать':'Активировать','toggleUser()');if(tab==='rights')h+='<p>card_correct: <b>'+(u.correct?'Назначено':'Не назначено')+'</b></p>'+btn(u.correct?'Отозвать card_correct':'Назначить card_correct','correct()')+'<p class="muted">card_number_correct автоматически доступно каждому активному администратору. Не назначается вручную.</p>';if(tab==='security')h+='<p>Сброс пароля другого пользователя требует повторного подтверждения личности администратора и отзыва всех сессий пользователя.</p>'+btn('Сбросить пароль','resetPassword()');if(tab==='history')h+=list(events.filter(e=>e[3]===u.name),['Дата','Событие','Инициатор','Цель','Результат'],e=>e.map(c=>'<td>'+esc(c)+'</td>').join('')+'<td>—</td>');return panel('Карточка сотрудника',h)}function newUser(){return panel('Новый сотрудник',btn('← Пользователи',"go('users')")+field('ФИО','newname','')+field('Логин','newlogin','')+'<label class="field">Роль<select id="newrole"><option>branch</option><option>archive</option><option>central_office</option><option>admin</option></select></label>'+btn('Создать','createUser()','primary'))}function createUser(){let name=document.getElementById('newname').value.trim(),login=document.getElementById('newlogin').value.trim(),role=document.getElementById('newrole').value;if(!name||!login||users.some(x=>x.login===login))return notify('Укажите ФИО и уникальный логин');if(role==='admin')return notify('Назначение администратора требует отдельного подтверждения паролем');let id='u'+(users.length+1);users.push({id,name,login,role,location:'—',active:true,correct:false});log('Создание сотрудника',name);go('users',id)}function simple(type){let data=type==='org'?org:type==='couriers'?couriers:shelves;let title=type==='org'?'Организация':type==='couriers'?'Курьеры':'Структура архива';if(!selected)return panel(title,searchbar()+'<p>'+btn('Добавить', "go('"+type+"','new')",'primary')+'</p>'+list(filtered(data),type==='shelves'?['Секция','Полка','Коробок','Статус']:['Название / ФИО','Статус'],x=>type==='shelves'?'<td>'+esc(x.section)+'</td><td>'+esc(x.name)+'</td><td>'+x.boxes+'</td><td>'+badge(x.active)+'</td><td>'+btn('Открыть',"go('"+type+"','"+x.id+"')")+'</td>':'<td>'+esc(x.name)+'</td><td>'+badge(x.active)+'</td><td>'+btn('Открыть',"go('"+type+"','"+x.id+"')")+'</td>'));let x=data.find(a=>a.id===selected);return panel(title,btn('← К списку',"go('"+type+"')")+(type==='shelves'?field('Секция','section',x?.section||''): '')+field(type==='couriers'?'ФИО':'Название','name',x?.name||'')+(x?'<p>'+badge(x.active)+'</p>':'')+btn('Сохранить','saveSimple()','primary')+(x?' '+btn(x.active?'Деактивировать':'Активировать','toggleSimple()'):''))}function saveSimple(){let data=view==='org'?org:view==='couriers'?couriers:shelves;let name=document.getElementById('name').value.trim();if(!name)return notify('Название / ФИО обязательно');if(view==='couriers'&&data.some(x=>x.id!==selected&&x.name.replace(/\s+/g,' ').toLowerCase()===name.replace(/\s+/g,' ').toLowerCase()))return notify('Курьер с таким ФИО уже существует');let x=data.find(x=>x.id===selected);if(!x){x={id:view+Date.now(),name,active:true};if(view==='shelves')x.boxes=0;data.push(x)}else x.name=name;if(view==='shelves')x.section=document.getElementById('section').value;log('Изменение справочника',name);go(view,x.id)}function toggleSimple(){let data=view==='org'?org:view==='couriers'?couriers:shelves;let x=data.find(x=>x.id===selected);if(view==='shelves'&&x.active&&x.boxes)return notify('Нельзя деактивировать полку: размещены коробки. Перемещение выполняет архив.');if(view==='org'&&x.active&&(users.some(u=>u.active&&u.location===x.name)))return notify('Нельзя деактивировать подразделение с активными сотрудниками');x.active=!x.active;log('Изменение активности справочника',x.name);notify('Статус изменён')}function objects(){return panel('Глобальный просмотр объектов','<p class="muted">Только просмотр. Операции приёмки, упаковки, размещения и выдачи администратору недоступны.</p><div class="tabs">'+['Карты','Коробки','Отправления','Заявки'].map(x=>btn(x,"notify('Выбран реестр: "+x+". Демо-данные не подключены')")).join('')+'</div><p>В рабочей системе поиск использует соответствующие разрешённые критерии и открывает карточку объекта с его бизнес-историей.</p>')}function audit(){return panel('Аудит безопасности','<p class="muted">Административные события отдельно от истории движения медицинских карт.</p>'+list(events,['Дата','Тип','Инициатор','Цель','Результат'],e=>e.map(x=>'<td>'+esc(x)+'</td>').join('')+'<td>—</td>'))}function render(){nav();document.getElementById('screen').innerHTML=(note?'<div class="warn">'+esc(note)+'</div>':'')+(view==='home'?panel('Управление МедАрхивом','<p class="muted">Управление сотрудниками, структурой и безопасностью. Без операционных действий архива и филиалов.</p><div class="grid">'+menu.slice(1).map(([v,t])=>'<div class="tile" role="button" tabindex="0" onclick="go(\''+v+'\')"><b>'+t+'</b><p class="muted">Открыть раздел</p></div>').join('')+'</div>'):view==='users'?userScreen():view==='newuser'?newUser():['org','couriers','shelves'].includes(view)?simple(view):view==='search'?objects():audit())}render();
</script></body></html>
