<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Центральный офис · проект v1</title><style>:root{font-family:'Segoe UI',Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:white;padding:19px 25px;display:flex;justify-content:space-between}main{max-width:1250px;margin:20px auto;padding:0 16px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:18px}.panel{border:1px solid #d8e4e9;background:#fff;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #223b4c0a}nav button{width:100%;text-align:left;margin-bottom:8px}button,input,select{font:inherit}button{border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;color:#1b536d;background:#fff;cursor:pointer}button:hover:not(:disabled){background:#edf6f8}button.primary{background:#116d7b;color:white;border-color:#116d7b}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #e5a852}input{padding:9px;border:1px solid #c0d1dc;border-radius:8px;max-width:100%}.muted{color:#667d8b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #e5edf0;padding:11px 8px;text-align:left}th{font-size:13px;color:#667d8b}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#eaf3f6;font-size:13px}.warn{background:#fff4df}.ok{background:#e5f5ed}.item{border:1px solid #e2ebef;border-radius:9px;padding:12px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}h1{font-size:25px}h2{font-size:19px}h3{font-size:16px}.stat{font-size:28px;font-weight:700}small{color:#667d8b}.notice{padding:12px;background:#fff4df;border-radius:9px;margin:12px 0}.good{background:#e5f5ed}@media(max-width:740px){.layout{grid-template-columns:1fr}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{width:auto}table{display:block;overflow:auto}header{flex-direction:column;gap:6px}}</style></head><body><header><div><b>МедАрхив</b> · Центральный офис</div><small style="color:#d5e6ec">Интерактивный проект UX-08 · учебные данные</small></header><main><div class="layout"><nav class="panel" id="nav"></nav><section id="screen"></section></div></main><script>
const people=[{id:'MC-801',name:'Иванов Иван Иванович',birth:'12.05.1985'},{id:'MC-802',name:'Петрова Анна Сергеевна',birth:'03.11.1977'},{id:'MC-803',name:'Сидоров Павел Олегович',birth:'18.02.1990'},{id:'MC-804',name:'Кузнецова Елена Викторовна',birth:'21.06.1982'},{id:'MC-805',name:'Смирнов Алексей Андреевич',birth:'07.09.1974'}];
let requests=[{id:'P09-301',author:'Вы',state:'processing',cards:['MC-801','MC-802','MC-803'],results:{'MC-801':'Готова к передаче','MC-802':'Готова к передаче','MC-803':'Не найдена'},shipment:'SH-201',received:['MC-801'],handed:true,events:['Заявка отправлена в архив','Архив начал обработку','Архив передал все подготовленные карты курьеру','Получена карта MC-801']},{id:'P09-302',author:'Коллега',state:'submitted',cards:['MC-804'],results:{},shipment:null,received:[],handed:false,events:['Заявка отправлена в архив']}];let draft=null,view='home',selected=null,query='',selectedReceipt=[],boxCards=['MC-805'],boxStatus='draft',courier='Курьер 1',boxId='BX-CO-01',events=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=id=>people.find(x=>x.id===id);const btn=(s,js,cls='')=>`<button class="${cls}" onclick="${js}">${s}</button>`;const tag=s=>`<span class="tag">${esc(s)}</span>`;const stateName=s=>({draft:'Черновик',submitted:'Отправлена в архив',processing:'Обрабатывается',completed:'Завершена',cancelled:'Отменена'})[s]||s;const myDraft=()=>requests.find(r=>r.state==='draft'&&r.author==='Вы');const cardRow=id=>{let x=p(id);return `<b>${esc(x.id)}</b> · ${esc(x.name)} · ${esc(x.birth)}`};function nav(){document.getElementById('nav').innerHTML='<h3>Центральный офис</h3>'+[['home','Главная'],['requests','Заявки в архив'],['incoming','Получение карт'],['boxes','Отправка коробок']].map(([v,n])=>btn(n,`go('${v}')`,v===view?'active':'')).join('')+'<p><small>Демонстрационный режим без сервера</small></p>'}function go(v,id=null){view=v;selected=id;query='';selectedReceipt=[];render()}function note(t){alert(t)}function card(t,c){return `<div class="panel"><h2>${t}</h2>${c}</div>`}function render(){nav();let h='';if(view==='home'){let awaiting=requests.filter(r=>r.handed&&r.cards.some(id=>r.results[id]==='Готова к передаче'&&!r.received.includes(id))).length;h=card('Главная',`<div class="row"><div class="item"><div class="stat">${requests.filter(r=>r.state==='submitted'||r.state==='processing').length}</div>Заявки в работе</div><div class="item"><div class="stat">${awaiting}</div>Отправления к получению</div><div class="item"><div class="stat">${boxStatus==='draft'?1:0}</div>Черновики отправки коробок</div></div><div class="actions">${btn('Заявки в архив',"go('requests')",'primary')}${btn('Получить карты',"go('incoming')")}${btn('Отправить коробки',"go('boxes')")}</div>`)}
if(view==='requests'){h=card('Заявки на карты из архива',`<div class="row between"><p class="muted">Черновик доступен только автору. После отправки состав заявки нельзя изменить.</p>${btn(myDraft()?'Продолжить мой черновик':'Создать заявку',"createDraft()",'primary')}</div><table><thead><tr><th>Заявка</th><th>Автор</th><th>Карт</th><th>Состояние</th><th></th></tr></thead><tbody>${requests.filter(r=>r.state!=='draft'||r.author==='Вы').map(r=>`<tr><td>${r.id}</td><td>${r.author}</td><td>${r.cards.length}</td><td>${tag(stateName(r.state))}</td><td>${btn('Открыть',`go('request','${r.id}')`)}</td></tr>`).join('')}</tbody></table>`)}
if(view==='request'){let r=requests.find(x=>x.id===selected);if(!r){go('requests');return}let isDraft=r.state==='draft';h=card(`Заявка ${esc(r.id)} · ${stateName(r.state)}`,`<div class="row">${btn('← К заявкам',"go('requests')")} ${tag('Автор: '+r.author)} ${tag(r.cards.length+' карт')}</div>${isDraft?`<h3>Найти карту по ФИО</h3><input id="search" placeholder="Введите ФИО" value="${esc(query)}" oninput="query=this.value;showSearch()" style="width:100%"><div id="matches"></div>`:''}<h3>Карты в заявке</h3>${r.cards.length?`<table><thead><tr><th>Карта / пациент</th><th>${isDraft?'':'Результат архива'}</th><th>${isDraft?'Действие':'Получение ЦО'}</th></tr></thead><tbody>${r.cards.map(id=>`<tr><td>${cardRow(id)}</td><td>${isDraft?'':esc(r.results[id]||'Ожидает обработки')}</td><td>${isDraft?btn('Убрать',`removeCard('${id}')`):r.received.includes(id)?tag('Получена'):r.handed&&r.results[id]==='Готова к передаче'?'Ожидается': '—'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Карты ещё не выбраны.</p>'}${isDraft?`<div class="actions">${btn('Отправить заявку в архив',`submitDraft()`, 'primary')}${btn('Отменить черновик',`cancelDraft()`)}</div>`:`<h3>Связанное отправление</h3><p>${r.shipment?esc(r.shipment)+' · '+(r.handed?'Передано курьеру':'Подготавливается'):'Пока не сформировано'}</p>${r.handed?btn('Открыть получение',`go('receipt','${r.id}')`,'primary'):''}<h3>История заявки</h3>${r.events.map(e=>`<div class="item">${esc(e)}</div>`).join('')}`}`);if(isDraft)setTimeout(showSearch,0)}
if(view==='incoming'){let rr=requests.filter(r=>r.handed&&r.cards.some(id=>r.results[id]==='Готова к передаче'));h=card('Получение карт из архива',`<p class="muted">Подтверждайте только фактически полученные карты. Отправление было передано курьеру целиком.</p>${rr.length?rr.map(r=>`<div class="item"><b>${r.shipment}</b> · заявка ${r.id}<p>${r.received.length} из ${r.cards.filter(id=>r.results[id]==='Готова к передаче').length} карт получено</p>${btn('Открыть приёмку',`go('receipt','${r.id}')`,'primary')}</div>`).join(''):'<p>Нет отправлений для получения.</p>'}`)}
if(view==='receipt'){let r=requests.find(x=>x.id===selected);if(!r){go('incoming');return}let sent=r.cards.filter(id=>r.results[id]==='Готова к передаче'),waiting=sent.filter(id=>!r.received.includes(id));h=card(`Получение ${r.shipment}`,`${btn('← К отправлениям',"go('incoming')")}<p><b>Заявка ${r.id}</b> · передано курьеру ${sent.length} карт одним отправлением</p><p>${tag(waiting.length?'Ожидается '+waiting.length+' карт':'Все карты получены')}</p>${sent.map(id=>`<div class="item"><label>${r.received.includes(id)?'✓ ':`<input type="checkbox" ${selectedReceipt.includes(id)?'checked':''} onchange="toggleReceipt('${id}',this.checked)"> `}${cardRow(id)} ${r.received.includes(id)?tag('Получена'):tag('Ожидается')}</label></div>`).join('')}<div class="actions">${btn('Подтвердить получение выбранных карт',`receive()`, 'primary')}</div><p class="muted">Ответственность за каждую карту переходит к ЦО только после подтверждения её получения.</p>`)}
if(view==='boxes'){h=card('Отправка коробок из ЦО в архив',`<p class="muted">Для возврата коробок в архив заявка на медицинские карты не требуется.</p><div class="row">${tag(boxStatus==='draft'?'Черновик':boxStatus==='in_transit'?'Передано курьеру':'Принято архивом')} ${tag(boxId)}</div><h3>Состав коробки</h3>${boxCards.map(id=>`<div class="item">${cardRow(id)} ${boxStatus==='draft'?btn('Убрать',`boxRemove('${id}')`):''}</div>`).join('')||'<p>Коробка пуста</p>'}${boxStatus==='draft'?`<h3>Добавить карту</h3><input id="boxsearch" placeholder="ФИО пациента" oninput="boxSearch(this.value)"><div id="boxmatches"></div><h3>Курьер</h3><select id="courier"><option>Курьер 1</option><option>Курьер 2</option></select><div class="actions">${btn('Передать коробку курьеру',`handoverBox()`, 'primary')}</div>`:'<p>Отправление передано. Состав больше не изменяется.</p>'}<h3>История</h3>${events.map(e=>`<div class="item">${esc(e)}</div>`).join('')}`)}document.getElementById('screen').innerHTML=h}
function createDraft(){let r=myDraft();if(!r){r={id:'P09-303',author:'Вы',state:'draft',cards:[],results:{},shipment:null,received:[],handed:false,events:['Создан черновик']};requests.push(r)}go('request',r.id)}function showSearch(){let el=document.getElementById('matches');if(!el)return;let r=requests.find(x=>x.id===selected);let q=query.toLocaleLowerCase('ru').trim();el.innerHTML=q.length<2?'<small>Введите не менее двух символов ФИО.</small>':people.filter(x=>x.name.toLocaleLowerCase('ru').includes(q)).map(x=>`<div class="item">${cardRow(x.id)} ${btn(r.cards.includes(x.id)?'Добавлена':'Добавить',`addCard('${x.id}')`,r.cards.includes(x.id)?'':'primary')}</div>`).join('')||'<p>Совпадений нет.</p>'}function addCard(id){let r=myDraft();if(!r||r.cards.includes(id))return;r.cards.push(id);render()}function removeCard(id){let r=myDraft();if(!r)return;r.cards=r.cards.filter(x=>x!==id);render()}function submitDraft(){let r=myDraft();if(!r||!r.cards.length)return note('Добавьте хотя бы одну карту.');if(!confirm('Отправить заявку в архив? После отправки нельзя изменить список карт.'))return;r.state='submitted';r.events.push('Заявка отправлена в архив');render()}function cancelDraft(){let r=myDraft();if(!r||!confirm('Отменить черновик?'))return;r.state='cancelled';go('requests')}function toggleReceipt(id,on){selectedReceipt=on?[...new Set([...selectedReceipt,id])]:selectedReceipt.filter(x=>x!==id)}function receive(){let r=requests.find(x=>x.id===selected);let valid=selectedReceipt.filter(id=>r.cards.includes(id)&&r.results[id]==='Готова к передаче'&&!r.received.includes(id));if(!valid.length)return note('Выберите фактически полученные карты.');if(!confirm(`Подтвердить получение ${valid.length} карт?`))return;r.received.push(...valid);r.events.push('ЦО подтвердил получение: '+valid.join(', '));let sent=r.cards.filter(id=>r.results[id]==='Готова к передаче');if(sent.every(id=>r.received.includes(id))){r.state='completed';r.events.push('Заявка завершена')}selectedReceipt=[];render()}function boxSearch(q){let e=document.getElementById('boxmatches');if(!e)return;e.innerHTML=q.length<2?'':people.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())&&!boxCards.includes(x.id)).map(x=>`<div class="item">${cardRow(x.id)} ${btn('Добавить в коробку',`boxAdd('${x.id}')`)}</div>`).join('')}function boxAdd(id){if(!boxCards.includes(id))boxCards.push(id);render()}function boxRemove(id){boxCards=boxCards.filter(x=>x!==id);render()}function handoverBox(){if(!boxCards.length)return note('Нельзя отправить пустую коробку.');if(!confirm('Передать коробку и все её карты курьеру?'))return;courier=document.getElementById('courier').value;boxStatus='in_transit';events.push('Коробка '+boxId+' передана: '+courier);render()}render();</script></body></html>
