<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Центральный офис · UX-08 v2</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:#fff;padding:19px 25px;display:flex;justify-content:space-between;gap:12px}main{max-width:1320px;margin:20px auto;padding:0 16px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:18px}.panel{border:1px solid #d8e4e9;background:#fff;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #223b4c0a}nav button{display:block;width:100%;height:44px;text-align:left;margin-bottom:8px}button,input,select{font:inherit}button{border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;color:#1b536d;background:#fff;cursor:pointer}button:hover:not(:disabled){background:#edf6f8}button.primary{background:#116d7b;color:#fff;border-color:#116d7b}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid #e5a852}input,select{padding:9px;border:1px solid #c0d1dc;border-radius:8px;max-width:100%}input[type=checkbox]{width:17px;height:17px;vertical-align:middle}.muted,small{color:#667d8b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.statcard{min-height:145px;display:flex;flex-direction:column;justify-content:center;border:1px solid #d8e4e9;border-radius:11px;padding:18px;background:#f9fcfd;cursor:pointer}.statcard:hover{border-color:#62afbb;background:#edf8fa}.stat{font-size:31px;font-weight:750;margin-bottom:8px}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #e5edf0;padding:10px 8px;text-align:left;vertical-align:middle}th{font-size:13px;color:#667d8b}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#eaf3f6;font-size:13px}.warn{background:#fff4df}.ok{background:#e5f5ed}.item{border:1px solid #e2ebef;border-radius:9px;padding:12px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}h1{font-size:25px;margin:0 0 14px}h2{font-size:19px}h3{font-size:16px}.notice{padding:12px;background:#fff4df;border-radius:9px;margin:12px 0}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}.filters label{display:flex;flex-direction:column;gap:5px;font-size:13px}.filters input{width:160px}.timeline{border-left:2px solid #c7e1e6;margin:12px 0 0 8px;padding-left:16px}.timeline .event{position:relative;padding:8px 0;border-bottom:1px solid #eaf0f2}.timeline .event:before{content:'';position:absolute;left:-22px;top:15px;background:#116d7b;border:3px solid #fff;border-radius:50%;width:10px;height:10px}.link{color:#116d7b;text-decoration:underline;cursor:pointer}.qr{width:100%;font-size:17px}.searchpane{margin:12px 0;padding:14px;border:1px solid #d8e4e9;border-radius:9px;background:#f9fcfd}.scroll{overflow-x:auto}.clickrow{cursor:pointer}.clickrow:hover{background:#f4fafb}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{width:auto;flex:1 1 140px}header{flex-direction:column}table{min-width:680px}}

let requests=[{id:'P09-301',author:'u1',created:'23.11.2026 10:15',state:'processing',cards:['MC-801','MC-802','MC-803'],results:{'MC-801':'extracted','MC-802':'extracted','MC-803':'not_found'},shipment:'SH-201',shipmentCreated:'23.11.2026 16:25',received:['MC-801'],handed:true,events:[['23.11.2026 10:15','Заявка создана','Соколова Мария Петровна'],['23.11.2026 10:17','Отправлена в архив','Соколова Мария Петровна'],['23.11.2026 11:40','Архив начал обработку','Сотрудник архива'],['23.11.2026 17:00','Отправление передано курьеру','Сотрудник архива'],['24.11.2026 09:30','Получена карта MC-801','Соколова Мария Петровна']]},{id:'P09-302',author:'u2',created:'24.11.2026 08:10',state:'submitted',cards:['MC-804'],results:{},shipment:null,shipmentCreated:null,received:[],handed:false,events:[['24.11.2026 08:10','Заявка создана','Иванов Дмитрий Сергеевич'],['24.11.2026 08:12','Отправлена в архив','Иванов Дмитрий Сергеевич']]},{id:'P09-299',author:'u1',created:'20.11.2026 12:30',state:'cancelled',cards:['MC-803'],results:{},shipment:null,received:[],handed:false,events:[['20.11.2026 12:30','Заявка создана','Соколова Мария Петровна'],['20.11.2026 12:35','Черновик отменён','Соколова Мария Петровна']]}];
let boxes=[{id:'BX-CO-01',created:'23.11.2026 10:00',cards:[],state:'free'},{id:'BX-CO-02',created:'24.11.2026 09:00',cards:[],state:'free'}],shipments=[],view='home',selected=null,query='',searchMode=false,selectedReceipt=[],selectedCards=[],activeBox='BX-CO-01',boxSelection=[],filters={requests:{from:'',to:'',mode:'active'},incoming:{from:'',to:'',mode:'active'},outgoing:{from:'',to:'',mode:'all'},cards:{mode:'all'}},notice='',sequence=303,boxSequence=3,shipmentSequence=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=id=>people.find(x=>x.id===id);const btn=(s,js,cls='')=>`<button class="${cls}" onclick="${js}">${s}</button>`;const tag=s=>`<span class="tag">${esc(s)}</span>`;const stateName=s=>({draft:'Черновик',submitted:'Отправлена в архив',processing:'Обрабатывается',completed:'Завершена',cancelled:'Отменена'})[s]||s;const ownDraft=()=>requests.find(r=>r.state==='draft'&&r.author===ME);const cardRow=id=>{const x=p(id);return x?`<b>${esc(x.id)}</b> · ${esc(x.name)} · ${esc(x.birth)}`:esc(id)};const availableArchive=()=>people.filter(x=>x.owner==='archive');const availableCO=()=>people.filter(x=>x.owner==='co'&&!x.external&&!boxes.some(b=>b.cards.includes(x.id)));
const day=s=>s?s.slice(6,10)+'-'+s.slice(3,5)+'-'+s.slice(0,2):'';const inPeriod=(created,f)=>{let d=day(created);return(!f.from||d>=f.from)&&(!f.to||d<=f.to)};const timeline=events=>`<div class="timeline">${[...events].reverse().map(e=>`<div class="event"><small>${esc(e[0])} · ${esc(e[2])}</small><div>${esc(e[1])}</div></div>`).join('')}</div>`;
function filterBar(type,showMode=true){let f=filters[type];let opts=type==='requests'?[['active','Без отменённых'],['all','Все, включая отменённые'],['cancelled','Только отменённые']]:type==='incoming'?[['active','Ожидают получения'],['all','Все отправления'],['completed','Полностью полученные']]:[['all','Все отправления'],['draft','Черновики'],['in_transit','Переданные']];return `<div class="filters"><label>Созданы с<input type="date" value="${f.from}" onchange="setFilter('${type}','from',this.value)"></label><label>По<input type="date" value="${f.to}" onchange="setFilter('${type}','to',this.value)"></label>${showMode?`<label>Показывать<select onchange="setFilter('${type}','mode',this.value)">${opts.map(([v,t])=>`<option value="${v}" ${f.mode===v?'selected':''}>${t}</option>`).join('')}</select></label>`:''}${btn('Сбросить период',`clearDates('${type}')`)}</div>`}
function setFilter(t,k,v){filters[t][k]=v;render()}function clearDates(t){filters[t].from='';filters[t].to='';render()}function card(title,body){return `<div class="panel"><h2>${title}</h2>${body}</div>`}function nav(){document.getElementById('nav').innerHTML='<h3>Центральный офис</h3>'+[['home','Главная'],['requests','Заявки в архив'],['incoming','Получение карт'],['cards','Карты ЦО'],['boxes','Отправка коробок']].map(([v,n])=>btn(n,`go('${v}')`,v===view?'active':'')).join('')+'<p><small>Без сервера · учебные события</small></p>'}function go(v,id=null){view=v;selected=id;query='';searchMode=false;selectedReceipt=[];selectedCards=[];notice='';render()}function homeGo(v){filters[v].mode=v==='requests'?'active':v==='incoming'?'active':'draft';go(v)}function message(s){notice=s;render()}function cardStatus(x){return x.external?'На внешнем хранении':'В ЦО'}function receiptSent(r){return r.cards.filter(id=>r.results[id]==='extracted')}function incomingState(r){let n=receiptSent(r).length;return r.received.length===n?'Получено полностью':r.received.length?'Частично получено':'Ожидает получения'}
function render(){nav();let h='';if(view==='home'){let work=requests.filter(r=>['submitted','processing'].includes(r.state)).length,inc=requests.filter(r=>r.handed&&receiptSent(r).some(id=>!r.received.includes(id))).length,drafts=shipments.filter(s=>s.state==='draft').length;h=card('Главная',`<div class="grid3"><div class="statcard" role="button" tabindex="0" onclick="homeGo('requests')" onkeydown="if(event.key==='Enter')homeGo('requests')"><div class="stat">${work}</div><b>Заявки в работе</b></div><div class="statcard" role="button" tabindex="0" onclick="homeGo('incoming')" onkeydown="if(event.key==='Enter')homeGo('incoming')"><div class="stat">${inc}</div><b>Отправления к получению</b></div><div class="statcard" role="button" tabindex="0" onclick="homeGo('outgoing')" onkeydown="if(event.key==='Enter')homeGo('outgoing')"><div class="stat">${drafts}</div><b>Черновики отправки коробок</b></div></div><p class="muted">Нажмите на карточку, чтобы перейти к списку.</p>`)}
if(view==='requests'){let f=filters.requests,rs=requests.filter(r=>(r.state!=='draft'||r.author===ME)&&inPeriod(r.created,f)&&(f.mode==='all'||(f.mode==='active'?r.state!=='cancelled':r.state==='cancelled')));h=card('Заявки на карты из архива',`<div class="row between"><p class="muted">Заявки создаёт ЦО. Черновик виден только автору.</p>${btn(ownDraft()?'Продолжить черновик':'Создать заявку','createDraft()','primary')}</div>${filterBar('requests')}<div class="scroll"><table><thead><tr><th>Номер</th><th>Создана (время сервера*)</th><th>Автор</th><th>Карт</th><th>Статус</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.created)}</td><td>${esc(users[r.author])}</td><td>${r.cards.length}</td><td>${tag(stateName(r.state))}</td><td>${btn('Открыть',`go('request','${r.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">По выбранным фильтрам заявок нет.</td></tr>'}</tbody></table></div>`)}
if(view==='request'){let r=requests.find(x=>x.id===selected);if(!r){go('requests');return}let draft=r.state==='draft';h=card(`Заявка ${esc(r.id)}`,`<div class="row">${btn('← К заявкам',"go('requests')")} ${tag(stateName(r.state))}</div><p><b>Создана:</b> ${esc(r.created)} · <b>Автор:</b> ${esc(users[r.author])} · <b>Карт:</b> ${r.cards.length}</p>${draft?`<h3>Добавить карты из архива</h3><p class="muted">Доступны карты на балансе архива, включая принятые без размещения.</p>${searchUI('request')}`:''}<h3>Карты в заявке</h3><div class="scroll"><table><thead><tr><th>Карта и пациент</th><th>Результат архива</th><th>Получение ЦО</th><th></th></tr></thead><tbody>${r.cards.map(id=>`<tr><td>${cardRow(id)}</td><td>${draft?'—':r.results[id]==='not_found'?'Не найдена':r.handed&&r.results[id]==='extracted'?'Отправлена в ЦО':r.results[id]==='extracted'?'Подготовлена к отправке':'Ожидает обработки'}</td><td>${r.received.includes(id)?tag('Получена'):r.handed&&r.results[id]==='extracted'?'Ожидается':'—'}</td><td>${draft?btn('Убрать',`removeCard('${id}')`):''}</td></tr>`).join('')||'<tr><td colspan="4">Пока нет карт.</td></tr>'}</tbody></table></div>${draft?`<div class="actions">${btn('Отправить заявку в архив','submitDraft()','primary')}${btn('Отменить черновик','cancelDraft()')}</div>`:`<h3>Связанное отправление</h3><p>${r.shipment?`${esc(r.shipment)} · создано ${esc(r.shipmentCreated)} · ${r.handed?'Передано курьеру':'Готовится'}`:'Пока не сформировано'}</p>${r.handed?btn('Открыть отправление',`go('receipt','${r.id}')`,'primary'):''}<h3>Хронология</h3>${timeline(r.events)}`}`)}
if(view==='incoming'){let f=filters.incoming,rr=requests.filter(r=>r.handed&&inPeriod(r.shipmentCreated,f)&&(f.mode==='all'||(f.mode==='active'?receiptSent(r).some(id=>!r.received.includes(id)):receiptSent(r).every(id=>r.received.includes(id)))));h=card('Получение карт из архива',`<p class="muted">Все подготовленные карты переданы одним отправлением. Получение можно подтверждать выбранными картами.</p>${filterBar('incoming')}<div class="scroll"><table><thead><tr><th>Отправление</th><th>Создано (время сервера*)</th><th>Заявка</th><th>Получено</th><th>Статус</th><th></th></tr></thead><tbody>${rr.map(r=>`<tr><td>${r.shipment}</td><td>${esc(r.shipmentCreated)}</td><td>${r.id}</td><td>${r.received.length} из ${receiptSent(r).length}</td><td>${tag(incomingState(r))}</td><td>${btn('Открыть отправление',`go('receipt','${r.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">Нет отправлений по фильтрам.</td></tr>'}</tbody></table></div>`)}
if(view==='receipt'){let r=requests.find(x=>x.id===selected);if(!r||!r.handed){go('incoming');return}let sent=receiptSent(r),waiting=sent.filter(id=>!r.received.includes(id));h=card(`Отправление ${esc(r.shipment)}`,`${btn('← К отправлениям',"go('incoming')")}<p><b>Создано:</b> ${esc(r.shipmentCreated)} · <b>Заявка:</b> <a href="#" onclick="event.preventDefault();go('request','${r.id}')">${r.id}</a> · ${tag(incomingState(r))}</p><p>Передано курьеру: ${sent.length} карт одним отправлением. Получено: ${r.received.length}. Ожидается: ${waiting.length}.</p><div class="actions">${btn('Выбрать все ожидающие','selectAllReceipt()')}${btn('Снять выбор','clearReceipt()')}</div>${sent.map(id=>`<div class="item"><label>${r.received.includes(id)?'✓':`<input type="checkbox" ${selectedReceipt.includes(id)?'checked':''} onchange="toggleReceipt('${id}',this.checked)">`} ${cardRow(id)} · ${tag(r.received.includes(id)?'Получена':'Ожидается')}</label></div>`).join('')}<div class="actions">${btn(`Подтвердить получение выбранных (${selectedReceipt.length})`,'receive()','primary')}</div><p class="muted">Отмечайте только фактически поступившие карты. До подтверждения ответственность остаётся у архива.</p><h3>Хронология</h3>${timeline(r.events.filter(e=>e[1].includes('Получена')||e[1].includes('Отправление')||e[1].includes('Заявка завершена')))}`)}
if(view==='cards'){let f=filters.cards,cs=people.filter(x=>x.owner==='co'&&(f.mode==='all'||(f.mode==='external'?x.external:!x.external)));h=card('Реестр карт на балансе ЦО',`<p class="muted">Карты, за которые отвечает ЦО. Выберите карты для оформления внешнего хранения.</p><div class="filters"><label>Статус хранения<select onchange="setFilter('cards','mode',this.value)"><option value="all" ${f.mode==='all'?'selected':''}>Все</option><option value="local" ${f.mode==='local'?'selected':''}>В ЦО</option><option value="external" ${f.mode==='external'?'selected':''}>На внешнем хранении</option></select></label></div><div class="scroll"><table><thead><tr><th>Выбор</th><th>Номер</th><th>ФИО</th><th>Дата рождения</th><th>Принята на баланс</th><th>Статус карты</th><th>Хранение</th></tr></thead><tbody>${cs.map(x=>`<tr><td><input type="checkbox" aria-label="Выбрать ${x.id}" ${x.external?'disabled':''} ${selectedCards.includes(x.id)?'checked':''} onchange="toggleCard('${x.id}',this.checked)"></td><td><a href="#" onclick="event.preventDefault();go('card','${x.id}')">${x.id}</a></td><td>${esc(x.name)}</td><td>${x.birth}</td><td>${esc(x.receivedAt)}</td><td>${tag(x.status)}</td><td>${tag(cardStatus(x))}</td></tr>`).join('')}</tbody></table></div><div class="actions">${btn(`Оформить внешнее хранение (${selectedCards.length})`,'externalize()','primary')}</div>${notice?`<div class="notice">${esc(notice)}</div>`:''}`)}
if(view==='card'){let x=p(selected);if(!x||x.owner!=='co'){go('cards');return}h=card(`Карта ${x.id}`,`${btn('← К реестру',"go('cards')")}<p><b>Пациент:</b> ${esc(x.name)}</p><p><b>Дата рождения:</b> ${x.birth}</p><p><b>Принята на баланс ЦО:</b> ${esc(x.receivedAt)}</p><p><b>Статус:</b> ${tag(x.status)} · ${tag(cardStatus(x))}</p>${!x.external?btn('Оформить внешнее хранение этой карты',`externalizeOne('${x.id}')`,'primary'):''}`)}
if(view==='boxes'){h=card('Отправка коробок из ЦО в архив',`<p class="muted">Создание и наполнение коробок. Добавлять можно только карты на балансе ЦО, не находящиеся на внешнем хранении. Новые карты здесь не создаются.</p><div class="actions">${btn('Создать коробку','createBox()','primary')}${btn('К списку отправлений',"go('outgoing')")}</div><h3>Коробки</h3>${boxes.filter(b=>b.state!=='written_off').map(b=>`<div class="item row between"><div><b>${b.id}</b> · ${tag(b.state==='free'?'Свободна':b.state==='draft'?'В черновике':'Передана')} · ${b.cards.length} карт<br><small>Создана: ${b.created}</small></div><div>${btn('Открыть',`go('box','${b.id}')`)} ${b.state==='free'&&!b.cards.length?btn('Списать',`writeOffBox('${b.id}')`):''}</div></div>`).join('')}<h3>Подготовка отправления</h3><p>Отметьте непустые свободные коробки, выберите курьера и создайте черновик.</p>${boxes.filter(b=>b.state==='free'&&b.cards.length).map(b=>`<div class="item"><label><input type="checkbox" ${boxSelection.includes(b.id)?'checked':''} onchange="toggleBox('${b.id}',this.checked)"> ${b.id} · ${b.cards.length} карт</label></div>`).join('')||'<p class="muted">Нет наполненных свободных коробок.</p>'}<div class="row"><label>Курьер <select id="courier"><option>Курьер 1</option><option>Курьер 2</option></select></label>${btn('Создать черновик отправления','createShipment()','primary')}</div>${notice?`<div class="notice">${esc(notice)}</div>`:''}`)}
if(view==='box'){let b=boxes.find(x=>x.id===selected);if(!b){go('boxes');return}h=card(`Коробка ${b.id}`,`${btn('← К коробкам',"go('boxes')")}<p><b>Создана:</b> ${b.created} · ${tag(b.state==='free'?'Свободна':b.state==='draft'?'В черновике':'Передана')} · карт: ${b.cards.length}</p><h3>Состав коробки</h3>${b.cards.map(id=>`<div class="item row between"><span>${cardRow(id)}</span>${b.state==='free'?btn('Убрать',`removeFromBox('${id}')`):''}</div>`).join('')||'<p class="muted">Коробка пуста.</p>'}${b.state==='free'?`<h3>Добавить карту ЦО</h3>${searchUI('box')}`:'<p class="muted">Состав коробки в черновике/после передачи не редактируется.</p>'}`)}
if(view==='outgoing'){let f=filters.outgoing,ss=shipments.filter(s=>inPeriod(s.created,f)&&(f.mode==='all'||s.state===f.mode));h=card('Отправления коробок в архив',`${btn('← К коробкам',"go('boxes')")}${filterBar('outgoing')}<div class="scroll"><table><thead><tr><th>Номер</th><th>Создано (время сервера*)</th><th>Коробки</th><th>Курьер</th><th>Статус</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${s.id}</td><td>${s.created}</td><td>${s.boxes.join(', ')}</td><td>${esc(s.courier)}</td><td>${tag(s.state==='draft'?'Черновик':'Передано курьеру')}</td><td>${btn('Открыть',`go('outshipment','${s.id}')`)}</td></tr>`).join('')||'<tr><td colspan="6">Отправлений пока нет.</td></tr>'}</tbody></table></div>`)}
if(view==='outshipment'){let s=shipments.find(x=>x.id===selected);if(!s){go('outgoing');return}h=card(`Отправление ${s.id}`,`${btn('← К отправлениям',"go('outgoing')")}<p><b>Создано:</b> ${s.created} · <b>Курьер:</b> ${esc(s.courier)} · ${tag(s.state==='draft'?'Черновик':'Передано курьеру')}</p><h3>Коробки</h3>${s.boxes.map(id=>`<div class="item">${id} · ${boxes.find(b=>b.id===id)?.cards.length||0} карт</div>`).join('')}<div class="actions">${s.state==='draft'?btn('Передать курьеру','handover()','primary')+btn('Отменить черновик','cancelShipment()'):''}</div><h3>Хронология</h3>${timeline(s.events)}`)}
document.getElementById('screen').innerHTML=h}
function searchUI(context){return `<div class="searchpane"><label><b>Сканирование карты</b><input class="qr" id="scan" placeholder="Номер карты или учебный QR · Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();scanCard('${context}')}"></label><div class="actions">${btn('Найти карту по ФИО',`toggleSearch()`)}</div>${searchMode?`<div style="margin-top:12px"><input style="width:100%" id="search" placeholder="Введите ФИО или часть ФИО" value="${esc(query)}" oninput="query=this.value;showMatches('${context}')"><div id="matches"></div></div>`:''}<small>Поиск ограничен доступными картами ${context==='request'?'архива':'ЦО без внешнего хранения'}.</small></div>`}
function toggleSearch(){searchMode=!searchMode;query='';render()}function showMatches(context){let e=document.getElementById('matches');if(!e)return;let q=query.trim().toLocaleLowerCase('ru').replace(/ё/g,'е');let source=context==='request'?availableArchive():availableCO();e.innerHTML=q.length<2?'<p class="muted">Введите не менее двух символов ФИО.</p>':source.filter(x=>x.name.toLocaleLowerCase('ru').replace(/ё/g,'е').includes(q)).map(x=>`<div class="item row between"><span>${cardRow(x.id)}${context==='request'&& !x.placed?' · Принята без размещения':''}</span>${btn(context==='request'?'Добавить в заявку':'Добавить в коробку',`addFound('${context}','${x.id}')`,'primary')}</div>`).join('')||'<p class="muted">Подходящих карт нет.</p>'}
function scanCard(context){let el=document.getElementById('scan');let raw=el.value.trim();let match=raw.match(/MC-\d+/i);let id=match?match[0].toUpperCase():raw.toUpperCase();let source=context==='request'?availableArchive():availableCO();if(!source.some(x=>x.id===id)){alert('Карта не найдена среди доступных карт '+(context==='request'?'архива.':'ЦО без внешнего хранения.'));return}addFound(context,id)}function addFound(context,id){if(context==='request'){let r=ownDraft();if(!r||!availableArchive().some(x=>x.id===id))return;if(!r.cards.includes(id))r.cards.push(id)}else{let b=boxes.find(x=>x.id===selected);if(!b||b.state!=='free'||!availableCO().some(x=>x.id===id))return;b.cards.push(id)}searchMode=false;query='';render();document.getElementById('scan')?.focus()}
function createDraft(){let r=ownDraft();if(!r){r={id:'P09-'+sequence++,author:ME,created:NOW,state:'draft',cards:[],results:{},shipment:null,received:[],handed:false,events:[[NOW,'Заявка создана',users[ME]]]};requests.push(r)}go('request',r.id)}function removeCard(id){let r=ownDraft();if(r){r.cards=r.cards.filter(x=>x!==id);render()}}function submitDraft(){let r=ownDraft();if(!r||!r.cards.length)return alert('Добавьте карты.');if(!confirm('Отправить заявку в архив? Состав нельзя будет изменить.'))return;r.state='submitted';r.events.push([NOW,'Отправлена в архив',users[ME]]);render()}function cancelDraft(){let r=ownDraft();if(!r||!confirm('Отменить черновик?'))return;r.state='cancelled';r.events.push([NOW,'Черновик отменён',users[ME]]);go('requests')}
function toggleReceipt(id,on){selectedReceipt=on?[...new Set([...selectedReceipt,id])]:selectedReceipt.filter(x=>x!==id);render()}function selectAllReceipt(){let r=requests.find(x=>x.id===selected);selectedReceipt=receiptSent(r).filter(id=>!r.received.includes(id));render()}function clearReceipt(){selectedReceipt=[];render()}function receive(){let r=requests.find(x=>x.id===selected);let valid=selectedReceipt.filter(id=>receiptSent(r).includes(id)&&!r.received.includes(id));if(!valid.length)return alert('Выберите фактически полученные карты.');if(!confirm(`Подтвердить получение ${valid.length} карт?`))return;r.received.push(...valid);for(let id of valid){let x=p(id);x.owner='co';x.external=false;x.receivedAt=NOW;x.status='Активна';r.events.push([NOW,'Получена карта '+id,users[ME]])}if(receiptSent(r).every(id=>r.received.includes(id))){r.state='completed';r.events.push([NOW,'Заявка завершена',users[ME]])}selectedReceipt=[];render()}
function toggleCard(id,on){selectedCards=on?[...new Set([...selectedCards,id])]:selectedCards.filter(x=>x!==id);render()}function externalizeOne(id){selectedCards=[id];externalize()}function externalize(){let valid=selectedCards.filter(id=>{let x=p(id);return x&&x.owner==='co'&&!x.external&&!boxes.some(b=>b.cards.includes(id))});if(!valid.length)return alert('Выберите карты ЦО, не находящиеся на внешнем хранении и не помещённые в коробку.');if(!confirm(`Оформить внешнее хранение для ${valid.length} карт? Учебная демонстрация.`))return;valid.forEach(id=>p(id).external=true);selectedCards=[];message('Оформлено внешнее хранение: '+valid.join(', ')+'. Учебная операция без серверного документооборота.')}
function createBox(){let id='BX-CO-'+String(boxSequence++).padStart(2,'0');boxes.push({id,created:NOW,cards:[],state:'free'});go('box',id)}function writeOffBox(id){let b=boxes.find(x=>x.id===id);if(!b||b.state!=='free'||b.cards.length)return alert('Списать можно только пустую свободную коробку.');if(!confirm('Списать пустую коробку '+id+'?'))return;b.state='written_off';render()}function removeFromBox(id){let b=boxes.find(x=>x.id===selected);if(!b||b.state!=='free')return;b.cards=b.cards.filter(x=>x!==id);render()}function toggleBox(id,on){boxSelection=on?[...new Set([...boxSelection,id])]:boxSelection.filter(x=>x!==id);render()}function createShipment(){let chosen=boxSelection.filter(id=>{let b=boxes.find(x=>x.id===id);return b&&b.state==='free'&&b.cards.length});if(!chosen.length)return alert('Выберите непустые свободные коробки.');let courier=document.getElementById('courier')?.value||'Курьер 1';let id='SH-CO-'+String(shipmentSequence++).padStart(3,'0');shipments.push({id,created:NOW,boxes:chosen,courier,state:'draft',events:[[NOW,'Создан черновик отправления',users[ME]]]});chosen.forEach(id=>boxes.find(b=>b.id===id).state='draft');boxSelection=[];go('outshipment',id)}function handover(){let s=shipments.find(x=>x.id===selected);if(!s||s.state!=='draft')return;if(!confirm('Передать все коробки отправления курьеру?'))return;s.state='in_transit';s.boxes.forEach(id=>boxes.find(b=>b.id===id).state='in_transit');s.events.push([NOW,'Передано курьеру '+s.courier,users[ME]]);render()}function cancelShipment(){let s=shipments.find(x=>x.id===selected);if(!s||s.state!=='draft'||!confirm('Отменить черновик отправления?'))return;s.boxes.forEach(id=>boxes.find(b=>b.id===id).state='free');shipments=shipments.filter(x=>x!==s);go('outgoing')}
render();
</script></body></html>
