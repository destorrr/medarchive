<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Архив • UX-08 v1</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:white;padding:19px 25px;display:flex;justify-content:space-between;gap:12px}main{max-width:1250px;margin:20px auto;padding:0 16px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:18px}.panel{border:1px solid #d8e4e9;background:#fff;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #223b4c0a}nav button{width:100%;text-align:left;margin-bottom:8px}button,input,select,textarea{font:inherit}button{border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;color:#1b536d;background:#fff;cursor:pointer}button:hover:not(:disabled){background:#edf6f8}button.primary{background:#116d7b;color:white;border-color:#116d7b}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f6b84d;outline-offset:2px}input,select,textarea{padding:9px;border:1px solid #bcced9;border-radius:8px;max-width:100%}textarea{width:100%;min-height:76px}h1{margin:0 0 7px;font-size:24px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:20px 0 8px}.muted{color:#627b89}.small{font-size:13px}.note{background:#fff8e4;border:1px solid #ecdba7;padding:12px 16px;border-radius:10px;margin-bottom:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.item{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #e5edf0;padding:12px 0;flex-wrap:wrap}.item:last-child{border-bottom:none}.item p{margin:4px 0}.tag{display:inline-block;padding:5px 9px;border-radius:40px;background:#e9f2f5;color:#23576c;font-size:12px;font-weight:700}.tag.ok{background:#e3f5eb;color:#14613f}.tag.warn{background:#fff2d5;color:#8a580c}.message{padding:12px 14px;background:#eaf6f2;border-radius:9px;margin-bottom:14px}.message.error{background:#fee9e9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:15px;border-radius:10px;background:#f4f9fb;border:1px solid #dce8ec;cursor:pointer}.metric strong{display:block;font-size:28px;margin-bottom:3px}.field{margin:11px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.field select,.field input{width:100%;max-width:440px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.check{width:18px;height:18px;vertical-align:middle}.divider{border:0;border-top:1px solid #e0e9ed;margin:17px 0}.timeline{margin:12px 0;padding-left:22px}.timeline li{padding:5px 0}.sub{background:#f7fafc;border:1px solid #dfe9ed;border-radius:10px;padding:15px;margin-top:13px}dialog{border:1px solid #ccdce3;border-radius:13px;box-shadow:0 12px 55px #19384c48;padding:22px;width:min(95vw,510px)}dialog::backdrop{background:#18344280}dialog h2{margin-bottom:10px}.pill{font-size:12px;color:#667d89}.wide{min-width:220px}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{display:flex;gap:7px;overflow:auto}nav button{white-space:nowrap;margin:0}.panel{padding:15px}header{padding:15px}h1{font-size:21px}}
</style></head><body><header><div><strong>МедАрхив</strong> <span style="opacity:.8">/ Рабочее место архива</span></div><span>UX-08 • прототип v1</span></header><main><div class="note"><strong>Демонстрационный прототип.</strong> Все номера и ФИО вымышлены; изменения существуют только в памяти этой вкладки. Нет реальных прав доступа, API, PostgreSQL и проверки аппаратного сканера.</div><div class="layout"><aside class="panel"><nav id="nav"></nav><hr class="divider"><button onclick="resetDemo()">Сбросить пример</button></aside><section><div id="message"></div><div id="content"></div></section></div></main><dialog id="dlg"><h2 id="dlgtitle"></h2><div id="dlgbody"></div><div class="row" style="justify-content:end;margin-top:16px"><button onclick="dlg.close()">Отмена</button><button class="primary" id="dlgconfirm">Подтвердить</button></div></dialog><script>
const seed=()=>({view:'home',filter:'awaiting',storageFilter:'unplaced',reqFilter:'active',current:null,shipments:[{id:'AR-401',from:'Филиал Северный',boxes:['BX-101','BX-102','BX-103'],received:['BX-101'],issues:[],events:['Создано отправление','Передано курьеру','Принята коробка BX-101']},{id:'AR-402',from:'ЦО',boxes:['BX-104','BX-105'],received:[],issues:[],events:['Создано отправление','Передано курьеру']}],boxes:[{id:'BX-101',count:4,shelf:null},{id:'BX-102',count:3,shelf:null,transit:true},{id:'BX-103',count:0,shelf:null,transit:true},{id:'BX-104',count:2,shelf:null,transit:true},{id:'BX-105',count:3,shelf:null,transit:true},{id:'BX-090',count:7,shelf:'Секция A / Полка 1'},{id:'BX-091',count:3,shelf:'Секция A / Полка 2'}],shelves:['Секция A / Полка 1','Секция A / Полка 2','Секция B / Полка 1'],requests:[{id:'P09-218',status:'submitted',phase:'new',from:'ЦО',courier:null,shipment:null,items:[{id:'MC-801',name:'Тестовый пациент 1',box:'BX-090',result:null},{id:'MC-802',name:'Тестовый пациент 2',box:'BX-090',result:null},{id:'MC-803',name:'Тестовый пациент 3',box:'BX-091',result:null}]},{id:'P09-219',status:'submitted',phase:'new',from:'ЦО',courier:null,shipment:null,items:[{id:'MC-804',name:'Тестовый пациент 4',box:'BX-091',result:null}]}],events:[]});let s=seed();const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(m,error=false){$('message').innerHTML='<div class="message '+(error?'error':'')+'">'+esc(m)+'</div>';window.scrollTo({top:0,behavior:'smooth'})}function setView(v,id){s.view=v;s.current=id||null;$('message').innerHTML='';render()}function resetDemo(){s=seed();render();notify('Учебные данные восстановлены')}function button(t,fn,primary=false,disabled=false){return '<button '+(primary?'class="primary" ':'')+(disabled?'disabled ':'')+'onclick="'+fn+'">'+esc(t)+'</button>'}function badge(t,klass=''){return '<span class="tag '+klass+'">'+esc(t)+'</span>'}function event(t){s.events.unshift(t)}function stamp(t){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' — '+t}function modal(title,content,onConfirm){$('dlgtitle').textContent=title;$('dlgbody').innerHTML=content;$('dlgconfirm').onclick=()=>{if(onConfirm()){ $('dlg').close();render()}};$('dlg').showModal()}
const nav=[['home','Главная'],['incoming','Приёмка'],['storage','Хранение'],['requests','Заявки ЦО'],['outgoing','Отправления']];function render(){ $('nav').innerHTML=nav.map(([v,l])=>'<button class="'+(['shipment'].includes(s.view)&&v==='incoming'||['box'].includes(s.view)&&v==='storage'||['request'].includes(s.view)&&v==='requests'||s.view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+l+'</button>').join('');const views={home, incoming,shipment,storage,box,requests,request,outgoing};$('content').innerHTML=(views[s.view]||home)()}
function home(){const incoming=s.shipments.filter(sh=>sh.received.length<sh.boxes.length).length,unplaced=s.boxes.filter(b=>!b.transit&&!b.shelf).length,newReq=s.requests.filter(r=>r.status==='submitted').length,working=s.requests.filter(r=>r.status==='processing').length;return '<div class="panel"><h1>Сегодня в архиве</h1><p class="muted">Выберите задачу и перейдите непосредственно к работе.</p><div class="grid"><div class="metric" onclick="setView(\'incoming\')"><strong>'+incoming+'</strong>Входящих отправлений</div><div class="metric" onclick="setView(\'storage\')"><strong>'+unplaced+'</strong>Коробок без размещения</div><div class="metric" onclick="setView(\'requests\')"><strong>'+newReq+'</strong>Новых заявок ЦО</div><div class="metric" onclick="setView(\'requests\')"><strong>'+working+'</strong>Заявок в обработке</div></div></div>'}
function incoming(){let list=s.shipments.filter(sh=>s.filter==='all'||s.filter==='awaiting'&&sh.received.length===0||s.filter==='partial'&&sh.received.length>0&&sh.received.length<sh.boxes.length||s.filter==='done'&&sh.received.length===sh.boxes.length);return '<div class="panel"><h1>Приёмка отправлений</h1><p class="muted">Подтверждайте фактически поступившие коробки по одной, без пересчёта карт.</p><div class="tabs">'+[['awaiting','Ожидают'],['partial','Частично приняты'],['done','Завершённые'],['all','Все']].map(([v,l])=>'<button class="'+(s.filter===v?'active':'')+'" onclick="s.filter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+ (list.length?list.map(sh=>'<div class="item"><div><strong>№ '+sh.id+'</strong><p class="muted">'+sh.from+' • Получено '+sh.received.length+' из '+sh.boxes.length+' коробок</p></div>'+button('Открыть',"setView('shipment','"+sh.id+"')")+'</div>').join(''):'<p class="muted">Отправлений с таким статусом нет.</p>')+'</div>'}
function shipment(){let sh=s.shipments.find(x=>x.id===s.current);if(!sh)return incoming();return '<div class="panel">'+button('← К входящим',"setView('incoming')")+'<h1 style="margin-top:16px">Отправление № '+sh.id+'</h1><p class="muted">'+sh.from+' → Архив • '+sh.received.length+' из '+sh.boxes.length+' коробок принято</p><h2>Коробки по манифесту</h2>'+sh.boxes.map(id=>{let accepted=sh.received.includes(id);return '<div class="item"><strong>'+id+'</strong><div class="row">'+badge(accepted?'Принята':'Ожидается',accepted?'ok':'warn')+(accepted?button('К размещению',"setView('box','"+id+"')"):button('Подтвердить приёмку',"receive('"+sh.id+"','"+id+"')",true))+'</div></div>'}).join('')+'<h3>Расхождения</h3><p class="muted">Исходный манифест не изменяется.</p>'+sh.issues.map(x=>'<div class="sub">'+esc(x)+'</div>').join('')+button('Зафиксировать расхождение',"issue('"+sh.id+"')")+'<h3>Хронология</h3><ol class="timeline">'+sh.events.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></div>'}
function receive(ship,id){modal('Подтвердить приёмку '+id,'<p>Подтвердите только фактически поступившую коробку. Размещение на полке выполняется позднее отдельной операцией.</p>',()=>{let sh=s.shipments.find(x=>x.id===ship);if(sh.received.includes(id))return false;sh.received.push(id);let b=s.boxes.find(x=>x.id===id);b.transit=false;sh.events.push(stamp('Принята коробка '+id));event('Принята '+id);notify('Коробка '+id+' принята. Для размещения откройте раздел «Хранение».');return true})}
function issue(ship){modal('Зафиксировать расхождение','<div class="field"><label for="itype">Тип</label><select id="itype"><option value="Недостающая">Недостающая коробка</option><option value="Лишняя">Лишняя коробка</option></select></div><div class="field"><label for="ibox">Номер коробки</label><input id="ibox" placeholder="Например, BX-103"></div>',()=>{let no=$('ibox').value.trim();if(!no){alert('Укажите номер коробки');return false}let sh=s.shipments.find(x=>x.id===ship);if($('itype').value==='Недостающая'&&!sh.boxes.includes(no)){alert('Недостающая коробка должна быть в манифесте');return false}let desc=$('itype').value+': '+no;sh.issues.push(desc);sh.events.push(stamp('Расхождение — '+desc));notify('Расхождение зафиксировано; состав манифеста не менялся.');return true})}
function storage(){let rows=s.boxes.filter(b=>!b.transit&&(s.storageFilter==='all'||s.storageFilter==='unplaced'&&!b.shelf||s.storageFilter==='placed'&&b.shelf));return '<div class="panel"><h1>Хранение</h1><p class="muted">На полках хранятся коробки, не отдельные карты.</p><div class="tabs">'+[['unplaced','Без размещения'],['placed','На полках'],['all','Все коробки']].map(([v,l])=>'<button class="'+(s.storageFilter===v?'active':'')+'" onclick="s.storageFilter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+ (rows.length?rows.map(b=>'<div class="item"><div><strong>'+b.id+'</strong><p class="muted">'+(b.shelf||'Нет размещения')+' • Карт: '+b.count+'</p></div>'+button(b.shelf?'Открыть':'Разместить',"setView('box','"+b.id+"')")+'</div>').join(''):'<p class="muted">Коробок в этом разделе нет.</p>')+'</div>'}
function box(){let b=s.boxes.find(x=>x.id===s.current);if(!b)return storage();return '<div class="panel">'+button('← К хранению',"setView('storage')")+'<h1 style="margin-top:16px">Коробка '+b.id+'</h1><p>Карт: '+b.count+' • '+(b.shelf?'Размещение: '+b.shelf:'Без размещения')+'</p><div class="row">'+button(b.shelf?'Переместить':'Разместить',"place('"+b.id+"')",true)+ (b.shelf?button('Снять с полки',"unplace('"+b.id+"')"):'')+'</div><div class="sub"><h3 style="margin-top:0">Перегруппировка карт</h3><p class="muted">Для демонстрации выберите количество карт и коробку назначения; состав меняется целиком за одно подтверждение. Для новой коробки размещение выполняется отдельно.</p>'+button('Переложить карты',"repack('"+b.id+"')",false,b.count===0)+'</div><h3>История</h3><ol class="timeline">'+s.events.filter(e=>e.includes(b.id)).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'}
function place(id){const b=s.boxes.find(x=>x.id===id);modal(b.shelf?'Перемещение '+id:'Размещение '+id,'<div class="field"><label for="shelf">Активная полка</label><select id="shelf">'+s.shelves.filter(x=>x!==b.shelf).map(x=>'<option>'+x+'</option>').join('')+'</select></div><p class="muted">Обычное перемещение не требует причины. История прежнего места сохраняется.</p>',()=>{if(!$('shelf').value){alert('Нет доступной полки');return false}let from=b.shelf||'без размещения';b.shelf=$('shelf').value;event(stamp(id+': '+from+' → '+b.shelf));notify('Размещение коробки обновлено');return true})}
function unplace(id){modal('Снять коробку '+id+' с полки','<p>Коробка останется в архиве без размещения. Состав не изменится.</p>',()=>{let b=s.boxes.find(x=>x.id===id),from=b.shelf;b.shelf=null;event(stamp(id+': снята с '+from));notify('Коробка снята с полки');return true})}
function repack(id){let src=s.boxes.find(x=>x.id===id);modal('Перегруппировка из '+id,'<div class="field"><label for="target">Куда</label><select id="target">'+s.boxes.filter(b=>!b.transit&&b.id!==id).map(b=>'<option value="'+b.id+'">'+b.id+' — '+(b.shelf||'без размещения')+'</option>').join('')+'<option value="new">Новая коробка</option></select></div><div class="field"><label for="qty">Сколько карт переложить (максимум '+src.count+')</label><input type="number" min="1" max="'+src.count+'" value="1" id="qty"></div>',()=>{let qty=Number($('qty').value),to=$('target').value;if(!Number.isInteger(qty)||qty<1||qty>src.count){alert('Проверьте количество');return false}let dest;if(to==='new'){dest={id:'BX-DEMO-'+(s.boxes.length+1),count:0,shelf:null};s.boxes.push(dest)}else dest=s.boxes.find(x=>x.id===to);if(!dest){alert('Выберите коробку');return false}src.count-=qty;dest.count+=qty;event(stamp(id+' → '+dest.id+': '+qty+' карт; размещение без изменений'));notify('Карты переложены. Размещение коробок не изменилось.');return true})}
function requests(){const list=s.requests.filter(r=>s.reqFilter==='all'||s.reqFilter==='active'&&['submitted','processing'].includes(r.status)||s.reqFilter==='new'&&r.status==='submitted'||s.reqFilter==='history'&&['completed','cancelled'].includes(r.status));return '<div class="panel"><h1>Заявки ЦО</h1><p class="muted">Обработка всех позиций до единого отправления. Заявки не закрепляются за одним сотрудником.</p><div class="tabs">'+[['active','В работе'],['new','Новые'],['history','История'],['all','Все']].map(([v,l])=>'<button class="'+(s.reqFilter===v?'active':'')+'" onclick="s.reqFilter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+(list.length?list.map(r=>'<div class="item"><div><strong>№ '+r.id+'</strong><p class="muted">ЦО • '+r.items.length+' карт • '+(r.status==='submitted'?'Новая':r.status==='processing'?'В обработке':r.status==='completed'?'Завершена':'Отменена')+'</p></div>'+button('Открыть',"setView('request','"+r.id+"')")+'</div>').join(''):'<p class="muted">Заявок нет.</p>')+'</div>'}
function request(){let r=s.requests.find(x=>x.id===s.current);if(!r)return requests();let extracted=r.items.filter(x=>x.result==='extracted').length;let freeze=!!r.shipment,transit=r.phase==='transit';let rows=r.items.map((x,i)=>'<div class="item"><div><strong>'+x.id+'</strong><p class="muted">'+x.name+' • '+x.box+'</p></div><div class="row">'+badge(x.result==='extracted'?'Готова к передаче':x.result==='not_found'?'Не найдена':x.result==='removed_by_archive'?'Исключена архивом':'Не обработана',x.result==='extracted'?'ok':'warn')+(r.status==='processing'&&!freeze&&!transit?'<select onchange="setResult(\''+r.id+'\','+i+',this.value);this.value=\'\'"><option value="">Изменить результат…</option><option value="not_found">Не найдена</option><option value="removed_by_archive">Исключена архивом</option><option value="extracted">Исправить: готова</option></select>':'')+'</div></div>').join('');let controls='';if(r.status==='submitted')controls=button('Начать обработку',"start('"+r.id+"')",true)+button('Отменить заявку',"cancelReq('"+r.id+"')");else if(r.status==='processing'&&!freeze)controls=extracted?button('Подготовить единое отправление ('+extracted+')',"prepare('"+r.id+"')",true):button('Завершить без отправления',"completeEmpty('"+r.id+"')",true);else if(r.status==='processing'&&r.phase==='draft')controls=button('Передать все карты курьеру',"handover('"+r.id+"')",true)+button('Отменить всю заявку',"cancelReq('"+r.id+"')");else if(transit)controls='<p class="muted">Все карты переданы одной операцией. Архив ожидает подтверждения получения в ЦО; повторная передача недоступна.</p>';return '<div class="panel">'+button('← К заявкам',"setView('requests')")+'<h1 style="margin-top:16px">Заявка № '+r.id+'</h1><p class="muted">ЦО → Архив (заявка на выдачу) • '+r.items.length+' карт • '+r.status+'</p>'+(r.status==='processing'?'<p>'+badge('Готовы: '+extracted+' / '+r.items.length,'ok')+(freeze?' '+badge('Состав отправления зафиксирован'):'')+'</p>':'')+'<h2>Позиции заявки</h2>'+rows+'<div class="row" style="margin-top:16px">'+controls+'</div>'+(r.shipment?'<div class="sub"><h3 style="margin-top:0">Связанное отправление '+r.shipment+'</h3><p>Маршрут: архив → ЦО • Курьер: '+r.courier+'</p><p class="muted">Манифест: все '+extracted+' готовых карт; изменить отдельные позиции нельзя.</p></div>':'')+'</div>'}
function start(id){modal('Начать обработку всей заявки','<p>Все позиции атомарно переходят в результат «Готова к передаче» (извлечена из архивной коробки). Это не физическая передача курьеру.</p>',()=>{let r=s.requests.find(x=>x.id===id);if(r.status!=='submitted')return false;r.status='processing';r.phase='review';r.items.forEach(x=>x.result='extracted');event(stamp(id+': начата обработка всех '+r.items.length+' позиций'));notify('Все позиции заявки извлечены в демонстрационной модели');return true})}
function setResult(id,i,result){if(!result)return;let r=s.requests.find(x=>x.id===id),x=r.items[i];if(r.status!=='processing'||r.shipment)return; if(result==='removed_by_archive'){modal('Исключить '+x.id,'<p>При исключении карта возвращается в коробку; причина обязательна при первом исключении.</p><div class="field"><label for="reason">Причина</label><textarea id="reason" placeholder="Обязательный комментарий"></textarea></div>',()=>{if(!$('reason').value.trim()){alert('Укажите причину');return false}x.result=result;event(stamp(id+' '+x.id+': исключена архивом'));notify('Результат изменён; история сохранена');return true})}else{modal('Изменить результат '+x.id,'<p>'+(result==='not_found'?'Указать «Не найдена»?':'Подтвердить повторное обнаружение и извлечение карты из коробки?')+'</p>',()=>{x.result=result;event(stamp(id+' '+x.id+': '+result));notify('Результат обновлён');return true})}}
function prepare(id){let r=s.requests.find(x=>x.id===id),ready=r.items.filter(x=>x.result==='extracted');if(!ready.length)return;modal('Одно отправление на все готовые карты','<p>До создания черновика все '+r.items.length+' позиций обработаны. В отправление войдут <strong>все '+ready.length+' готовых карт</strong>, без выбора подмножества. После создания результаты нельзя исправлять.</p><div class="field"><label for="courier">Активный курьер</label><select id="courier"><option value="">Выберите курьера</option><option>Учебный курьер 1</option><option>Учебный курьер 2</option></select></div>',()=>{if(!$('courier').value){alert('Выберите курьера');return false}r.courier=$('courier').value;r.shipment='OUT-'+id;r.phase='draft';event(stamp(id+': создан единый черновик '+r.shipment));notify('Черновик создан. Состав зафиксирован; передача — отдельное действие.');return true})}
function handover(id){let r=s.requests.find(x=>x.id===id);modal('Передать весь манифест','<p>Однократная передача всех '+r.items.filter(x=>x.result==='extracted').length+' готовых карт курьеру. Частично передать карты нельзя.</p>',()=>{if(r.phase!=='draft')return false;r.phase='transit';event(stamp(id+': единая передача всех готовых карт'));notify('Все карты переданы курьеру. Заявка остаётся в работе до приёмки ЦО.');return true})}
function cancelReq(id){modal('Отмена всей заявки '+id,'<p>До передачи курьеру можно отменить только всю заявку с обязательной причиной. История сохраняется.</p><div class="field"><label for="reason">Причина отмены</label><textarea id="reason"></textarea></div>',()=>{if(!$('reason').value.trim()){alert('Укажите причину');return false}let r=s.requests.find(x=>x.id===id);if(r.phase==='transit')return false;r.status='cancelled';r.phase='cancelled';r.shipment=null;event(stamp(id+': отменена вся заявка'));notify('Заявка отменена');return true})}
function completeEmpty(id){modal('Завершить без отправления','<p>Ни одна карта не готова к передаче. Завершить заявку без отправления?</p>',()=>{let r=s.requests.find(x=>x.id===id);if(r.items.some(x=>x.result==='extracted'))return false;r.status='completed';r.phase='done';event(stamp(id+': завершена без отправления'));notify('Заявка завершена без отправления');return true})}
function outgoing(){let list=s.requests.filter(r=>r.shipment);return '<div class="panel"><h1>Исходящие отправления в ЦО</h1><p class="muted">По каждой заявке — не более одного отправления, все готовые карты передаются одновременно.</p>'+(list.length?list.map(r=>'<div class="item"><div><strong>'+r.shipment+'</strong><p class="muted">Заявка '+r.id+' • '+r.courier+' • '+(r.phase==='transit'?'Передано ЦО через курьера':'Черновик')+'</p></div>'+button('Открыть заявку',"setView('request','"+r.id+"')")+'</div>').join(''):'<p class="muted">Пока нет отправлений. Создайте их из обработанной заявки ЦО.</p>')+'</div>'}
render();</script></body></html>
