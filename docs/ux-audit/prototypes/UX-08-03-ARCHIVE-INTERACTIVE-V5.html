<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Архив • UX-08 v5</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:white;padding:19px 25px;display:flex;justify-content:space-between;gap:12px}main{max-width:1250px;margin:20px auto;padding:0 16px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:18px}.panel{border:1px solid #d8e4e9;background:#fff;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 3px 10px #223b4c0a}nav button{width:100%;text-align:left;margin-bottom:8px}button,input,select,textarea{font:inherit}button{border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;color:#1b536d;background:#fff;cursor:pointer}button:hover:not(:disabled){background:#edf6f8}button.primary{background:#116d7b;color:white;border-color:#116d7b}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f6b84d;outline-offset:2px}input,select,textarea{padding:9px;border:1px solid #bcced9;border-radius:8px;max-width:100%}textarea{width:100%;min-height:76px}h1{margin:0 0 7px;font-size:24px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:20px 0 8px}.muted{color:#627b89}.small{font-size:13px}.note{background:#fff8e4;border:1px solid #ecdba7;padding:12px 16px;border-radius:10px;margin-bottom:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.item{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #e5edf0;padding:12px 0;flex-wrap:wrap}.item:last-child{border-bottom:none}.item p{margin:4px 0}.tag{display:inline-block;padding:5px 9px;border-radius:40px;background:#e9f2f5;color:#23576c;font-size:12px;font-weight:700}.tag.ok{background:#e3f5eb;color:#14613f}.tag.warn{background:#fff2d5;color:#8a580c}.message{padding:12px 14px;background:#eaf6f2;border-radius:9px;margin-bottom:14px}.message.error{background:#fee9e9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:15px;border-radius:10px;background:#f4f9fb;border:1px solid #dce8ec;cursor:pointer}.metric strong{display:block;font-size:28px;margin-bottom:3px}.field{margin:11px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.field select,.field input{width:100%;max-width:440px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.check{width:18px;height:18px;vertical-align:middle}.divider{border:0;border-top:1px solid #e0e9ed;margin:17px 0}.timeline{margin:12px 0;padding-left:22px}.timeline li{padding:5px 0}.sub{background:#f7fafc;border:1px solid #dfe9ed;border-radius:10px;padding:15px;margin-top:13px}dialog{border:1px solid #ccdce3;border-radius:13px;box-shadow:0 12px 55px #19384c48;padding:22px;width:min(95vw,510px)}dialog::backdrop{background:#18344280}dialog h2{margin-bottom:10px}.pill{font-size:12px;color:#667d89}.wide{min-width:220px}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{display:flex;gap:7px;overflow:auto}nav button{white-space:nowrap;margin:0}.panel{padding:15px}header{padding:15px}h1{font-size:21px}}
</style><style>
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.report-section{border:1px solid #cbdde5;border-radius:10px;padding:12px;background:#f8fbfc}.report-shelf{margin:8px 0 8px 14px;border-left:3px solid #8bb9c3;padding-left:12px}.report-boxes{display:flex;flex-wrap:wrap;gap:9px}.report-box{background:#fff;border:1px solid #d8e4e9;padding:12px;border-radius:9px;min-width:155px}.report-filters{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.report-filters label{display:flex;flex-direction:column;gap:5px;font-size:13px}.table-wrap{overflow-x:auto}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{padding:11px;border-bottom:1px solid #e1eaee;text-align:left}.report-table th{background:#edf5f7}#print-sheet{display:none}@media print{body>*:not(#print-sheet){display:none!important}#print-sheet{display:block!important;font:11pt Arial,sans-serif;color:#111}#print-sheet h1{font-size:18pt}#print-sheet table{width:100%;border-collapse:collapse}#print-sheet th,#print-sheet td{border:1px solid #777;padding:7px;text-align:left}#print-sheet th{background:#eee}#print-sheet .check-col{min-width:55px}#print-sheet .print-foot{margin-top:35px}@page{size:A4 landscape;margin:12mm}}
</style></head><body><header><div><strong>МедАрхив</strong> <span style="opacity:.8">/ Рабочее место архива</span></div><span>UX-08 • прототип v3</span></header><main><div class="note"><strong>Демонстрационный прототип.</strong> Все номера и ФИО вымышлены; изменения существуют только в памяти этой вкладки. Нет реальных прав доступа, API, PostgreSQL и проверки аппаратного сканера.</div><div class="layout"><aside class="panel"><nav id="nav"></nav><hr class="divider"><button onclick="resetDemo()">Сбросить пример</button></aside><section><div id="message"></div><div id="content"></div></section></div></main><dialog id="dlg"><h2 id="dlgtitle"></h2><div id="dlgbody"></div><div class="row" style="justify-content:end;margin-top:16px"><button onclick="dlg.close()">Отмена</button><button class="primary" id="dlgconfirm">Подтвердить</button></div></dialog><script>
const seed=()=>({view:'home',filter:'awaiting',storageFilter:'unplaced',reportMode:'visual',reportSection:'',reportShelf:'',reportQuery:'',reportPlacement:'all',reqFilter:'active',current:null,shipments:[{id:'AR-401',from:'Филиал Северный',boxes:['BX-101','BX-102','BX-103'],received:['BX-101'],issues:[],events:['Создано отправление','Передано курьеру','Принята коробка BX-101']},{id:'AR-402',from:'ЦО',boxes:['BX-104','BX-105'],received:[],issues:[],events:['Создано отправление','Передано курьеру']}],boxes:[{id:'BX-101',count:4,shelf:null},{id:'BX-102',count:3,shelf:null,transit:true},{id:'BX-103',count:0,shelf:null,transit:true},{id:'BX-104',count:2,shelf:null,transit:true},{id:'BX-105',count:3,shelf:null,transit:true},{id:'BX-090',count:7,shelf:'Секция A / Полка 1'},{id:'BX-091',count:3,shelf:'Секция A / Полка 2'}],shelves:['Секция A / Полка 1','Секция A / Полка 2','Секция B / Полка 1'],requests:[{id:'P09-218',status:'submitted',phase:'new',from:'ЦО',courier:null,shipment:null,items:[{id:'MC-801',name:'Тестовый пациент 1',box:'BX-090',result:null},{id:'MC-802',name:'Тестовый пациент 2',box:'BX-090',result:null},{id:'MC-803',name:'Тестовый пациент 3',box:'BX-091',result:null}]},{id:'P09-219',status:'submitted',phase:'new',from:'ЦО',courier:null,shipment:null,items:[{id:'MC-804',name:'Тестовый пациент 4',box:'BX-091',result:null}]}],events:[]});function initializeCards(state){let k=1;for(const b of state.boxes){b.cards=Array.from({length:b.count},(_,i)=>({id:'MC-DEMO-'+String(k++).padStart(3,'0'),name:'Учебный пациент '+(k-1),dob:'01.01.1980'}))}for(const r of state.requests)for(const item of r.items){const b=state.boxes.find(x=>x.id===item.box);if(b){const i=b.cards.findIndex(x=>!x.requestId);if(i>=0){b.cards[i]={id:item.id,name:item.name,dob:'12.05.1985',requestId:r.id}}}}return state}let s=initializeCards(seed());const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(m,error=false){$('message').innerHTML='<div class="message '+(error?'error':'')+'">'+esc(m)+'</div>';window.scrollTo({top:0,behavior:'smooth'})}function setView(v,id){s.view=v;s.current=id||null;$('message').innerHTML='';render()}function resetDemo(){s=initializeCards(seed());render();notify('Учебные данные восстановлены')}function button(t,fn,primary=false,disabled=false){return '<button '+(primary?'class="primary" ':'')+(disabled?'disabled ':'')+'onclick="'+fn+'">'+esc(t)+'</button>'}function badge(t,klass=''){return '<span class="tag '+klass+'">'+esc(t)+'</span>'}function event(t){s.events.unshift(t)}function stamp(t){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' — '+t}function modal(title,content,onConfirm){$('dlgtitle').textContent=title;$('dlgbody').innerHTML=content;$('dlgconfirm').onclick=()=>{if(onConfirm()){ $('dlg').close();render()}};$('dlg').showModal()}
const nav=[['home','Главная'],['incoming','Приёмка'],['storage','Хранение'],['requests','Заявки ЦО'],['outgoing','Отправления'],['occupancy','Загрузка архива']];function render(){ $('nav').innerHTML=nav.map(([v,l])=>'<button class="'+(['shipment'].includes(s.view)&&v==='incoming'||['box'].includes(s.view)&&v==='storage'||['request'].includes(s.view)&&v==='requests'||s.view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+l+'</button>').join('');const views={home, incoming,shipment,storage,box,requests,request,outgoing,occupancy};$('content').innerHTML=(views[s.view]||home)()}
function home(){const incoming=s.shipments.filter(sh=>sh.received.length<sh.boxes.length).length,unplaced=s.boxes.filter(b=>!b.transit&&!b.shelf).length,newReq=s.requests.filter(r=>r.status==='submitted').length,working=s.requests.filter(r=>r.status==='processing').length;return '<div class="panel"><h1>Сегодня в архиве</h1><p class="muted">Выберите задачу и перейдите непосредственно к работе.</p><div class="grid"><div class="metric" onclick="setView(\'incoming\')"><strong>'+incoming+'</strong>Входящих отправлений</div><div class="metric" onclick="setView(\'storage\')"><strong>'+unplaced+'</strong>Коробок без размещения</div><div class="metric" onclick="setView(\'requests\')"><strong>'+newReq+'</strong>Новых заявок ЦО</div><div class="metric" onclick="setView(\'requests\')"><strong>'+working+'</strong>Заявок в обработке</div></div></div>'}
function incoming(){let list=s.shipments.filter(sh=>s.filter==='all'||s.filter==='awaiting'&&sh.received.length===0||s.filter==='partial'&&sh.received.length>0&&sh.received.length<sh.boxes.length||s.filter==='done'&&sh.received.length===sh.boxes.length);return '<div class="panel"><h1>Приёмка отправлений</h1><p class="muted">Подтверждайте фактически поступившие коробки по одной, без пересчёта карт.</p><div class="tabs">'+[['awaiting','Ожидают'],['partial','Частично приняты'],['done','Завершённые'],['all','Все']].map(([v,l])=>'<button class="'+(s.filter===v?'active':'')+'" onclick="s.filter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+ (list.length?list.map(sh=>'<div class="item"><div><strong>№ '+sh.id+'</strong><p class="muted">'+sh.from+' • Получено '+sh.received.length+' из '+sh.boxes.length+' коробок</p></div>'+button('Открыть',"setView('shipment','"+sh.id+"')")+'</div>').join(''):'<p class="muted">Отправлений с таким статусом нет.</p>')+'</div>'}
function shipment(){let sh=s.shipments.find(x=>x.id===s.current);if(!sh)return incoming();return '<div class="panel">'+button('← К входящим',"setView('incoming')")+'<h1 style="margin-top:16px">Отправление № '+sh.id+'</h1><p class="muted">'+sh.from+' → Архив • '+sh.received.length+' из '+sh.boxes.length+' коробок принято</p><h2>Коробки в отправлении</h2>'+sh.boxes.map(id=>{let accepted=sh.received.includes(id),missing=sh.issues.includes('Недостающая: '+id);return '<div class="item" style="'+(missing?'background:#fff5e8;border-left:4px solid #cf8b29;padding-left:12px;border-radius:7px;':'')+'"><div><strong>'+id+'</strong>'+(missing?'<p class="muted small">Коробка отмечена как не поступившая. При фактическом поступлении отметку можно снять.</p>':'')+'</div><div class="row">'+badge(accepted?'Принята':missing?'Не поступила':'Ожидается',accepted?'ok':'warn')+(accepted?button('К размещению',"setView('box','"+id+"')"):missing?button('Снять отметку',"clearMissing('"+sh.id+"','"+id+"')"):button('Подтвердить приёмку',"receive('"+sh.id+"','"+id+"')",true)+button('Не поступила',"missing('"+sh.id+"','"+id+"')"))+'</div></div>'}).join('')+'<h3>Расхождения</h3><p class="muted">Список коробок в отправлении остаётся без изменений.</p>'+(sh.issues.length?sh.issues.map(x=>'<div class="sub">'+esc(x)+'</div>').join(''):'<p class="muted">Расхождений пока нет.</p>')+button('Добавить лишнюю коробку',"issue('"+sh.id+"')")+'<h3>Хронология</h3><ol class="timeline">'+sh.events.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></div>'}
function missing(ship,id){modal('Коробка '+id+' не поступила','<p>Отметить коробку как не поступившую? В списке отправления появится предупреждение. Подтвердить приёмку можно будет после снятия отметки.</p>',()=>{let sh=s.shipments.find(x=>x.id===ship);if(!sh||sh.received.includes(id))return false;if(sh.issues.includes('Недостающая: '+id)){alert('Это расхождение уже записано');return false}sh.issues.push('Недостающая: '+id);sh.events.push(stamp('Не поступила коробка '+id));notify('Коробка отмечена как не поступившая');return true})}
function clearMissing(ship,id){modal('Снять отметку с '+id,'<p>Коробка фактически поступила? Снимите отметку «Не поступила», затем отдельно подтвердите приёмку. Запись об изменении останется в хронологии.</p>',()=>{let sh=s.shipments.find(x=>x.id===ship),i=sh.issues.indexOf('Недостающая: '+id);if(i<0||sh.received.includes(id))return false;sh.issues.splice(i,1);sh.events.push(stamp('Снята отметка «Не поступила» для '+id));notify('Отметка снята. Теперь можно подтвердить приёмку коробки.');return true})}
function receive(ship,id){modal('Подтвердить приёмку '+id,'<p>Подтвердите только фактически поступившую коробку. Размещение на полке выполняется позднее отдельной операцией.</p>',()=>{let sh=s.shipments.find(x=>x.id===ship);if(sh.received.includes(id)||sh.issues.includes('Недостающая: '+id))return false;sh.received.push(id);let b=s.boxes.find(x=>x.id===id);b.transit=false;sh.events.push(stamp('Принята коробка '+id));event('Принята '+id);notify('Коробка '+id+' принята. Для размещения откройте раздел «Хранение».');return true})}
function issue(ship){modal('Добавить лишнюю коробку','<p>Укажите номер коробки, которая поступила, но отсутствует в списке отправления.</p><div class="field"><label for="ibox">Номер лишней коробки</label><input id="ibox" placeholder="Например, BX-106"></div>',()=>{let no=$('ibox').value.trim();if(!no){alert('Укажите номер коробки');return false}let sh=s.shipments.find(x=>x.id===ship);if(sh.boxes.includes(no)){alert('Эта коробка уже есть в списке отправления');return false}let desc='Лишняя: '+no;if(sh.issues.includes(desc)){alert('Эта коробка уже отмечена как лишняя');return false}sh.issues.push(desc);sh.events.push(stamp('Расхождение — '+desc));notify('Лишняя коробка отмечена; список коробок отправления не изменился.');return true})}
function storage(){let rows=s.boxes.filter(b=>!b.transit&&(s.storageFilter==='all'||s.storageFilter==='unplaced'&&!b.shelf||s.storageFilter==='placed'&&b.shelf));return '<div class="panel"><h1>Хранение</h1><p class="muted">На полках хранятся коробки, не отдельные карты.</p><div class="tabs">'+[['unplaced','Без размещения'],['placed','На полках'],['all','Все коробки']].map(([v,l])=>'<button class="'+(s.storageFilter===v?'active':'')+'" onclick="s.storageFilter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+ (rows.length?rows.map(b=>'<div class="item"><div><strong>'+b.id+'</strong><p class="muted">'+(b.shelf||'Нет размещения')+' • Карт: '+b.count+'</p></div>'+button(b.shelf?'Открыть':'Разместить',"setView('box','"+b.id+"')")+'</div>').join(''):'<p class="muted">Коробок в этом разделе нет.</p>')+'</div>'}
function box(){let b=s.boxes.find(x=>x.id===s.current);if(!b)return storage();return '<div class="panel">'+button('← К хранению',"setView('storage')")+'<h1 style="margin-top:16px">Коробка '+b.id+'</h1><p>Карт: '+b.count+' • '+(b.shelf?'Размещение: '+b.shelf:'Без размещения')+'</p><div class="row">'+button(b.shelf?'Переместить':'Разместить',"place('"+b.id+"')",true)+ (b.shelf?button('Снять с полки',"unplace('"+b.id+"')"):'')+'</div><div class="sub"><h3 style="margin-top:0">Перегруппировка карт</h3><p class="muted">Выберите конкретные карты и коробку назначения. Перед подтверждением проверьте выбранные карты. Для новой коробки размещение выполняется отдельно.</p>'+button('Переложить карты',"repack('"+b.id+"')",false,b.count===0)+'</div><h3>История</h3><ol class="timeline">'+s.events.filter(e=>e.includes(b.id)).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'}
function place(id){const b=s.boxes.find(x=>x.id===id);modal(b.shelf?'Перемещение '+id:'Размещение '+id,'<div class="field"><label for="shelf">Активная полка</label><select id="shelf">'+s.shelves.filter(x=>x!==b.shelf).map(x=>'<option>'+x+'</option>').join('')+'</select></div><p class="muted">Обычное перемещение не требует причины. История прежнего места сохраняется.</p>',()=>{if(!$('shelf').value){alert('Нет доступной полки');return false}let from=b.shelf||'без размещения';b.shelf=$('shelf').value;event(stamp(id+': '+from+' → '+b.shelf));notify('Размещение коробки обновлено');return true})}
function unplace(id){modal('Снять коробку '+id+' с полки','<p>Коробка останется в архиве без размещения. Состав не изменится.</p>',()=>{let b=s.boxes.find(x=>x.id===id),from=b.shelf;b.shelf=null;event(stamp(id+': снята с '+from));notify('Коробка снята с полки');return true})}
function repack(id){let src=s.boxes.find(x=>x.id===id);let available=src.cards.filter(c=>!c.requestId);modal('Перегруппировка из '+id,'<p>Выберите карты для перемещения:</p>'+available.map(c=>'<label class="item" style="justify-content:start"><input type="checkbox" class="check move-card" value="'+esc(c.id)+'"> <span><strong>'+esc(c.id)+'</strong><br>'+esc(c.name)+' • '+esc(c.dob)+'</span></label>').join('')+'<div class="field"><label for="target">Коробка назначения</label><select id="target">'+s.boxes.filter(b=>!b.transit&&b.id!==id).map(b=>'<option value="'+b.id+'">'+b.id+' — '+(b.shelf||'без размещения')+'</option>').join('')+'<option value="new">Новая коробка</option></select></div><p class="muted">Полки не изменятся. Карты, связанные с незавершёнными заявками, выбирать нельзя.</p>',()=>{let ids=[...document.querySelectorAll('.move-card:checked')].map(x=>x.value),to=$('target').value;if(!ids.length){alert('Выберите хотя бы одну карту');return false}let cards=src.cards.filter(c=>ids.includes(c.id)&&!c.requestId);if(cards.length!==ids.length){alert('Список карт изменился');return false}let dest;if(to==='new'){dest={id:'BX-DEMO-'+(s.boxes.length+1),count:0,cards:[],shelf:null};s.boxes.push(dest)}else dest=s.boxes.find(x=>x.id===to);if(!dest||dest.transit){alert('Выберите доступную коробку');return false}src.cards=src.cards.filter(c=>!ids.includes(c.id));dest.cards.push(...cards);src.count=src.cards.length;dest.count=dest.cards.length;event(stamp(id+' → '+dest.id+': карты '+ids.join(', ')));notify('Выбранные карты перемещены в '+dest.id+'. Полки не изменились.');return true})}
function requests(){const list=s.requests.filter(r=>s.reqFilter==='all'||s.reqFilter==='active'&&['submitted','processing'].includes(r.status)||s.reqFilter==='new'&&r.status==='submitted'||s.reqFilter==='history'&&['completed','cancelled'].includes(r.status));return '<div class="panel"><h1>Заявки ЦО</h1><p class="muted">Обработка всех позиций до единого отправления. Заявки не закрепляются за одним сотрудником.</p><div class="tabs">'+[['active','В работе'],['new','Новые'],['history','Завершённые и отменённые'],['all','Все']].map(([v,l])=>'<button class="'+(s.reqFilter===v?'active':'')+'" onclick="s.reqFilter=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+(list.length?list.map(r=>'<div class="item"><div><strong>№ '+r.id+'</strong><p class="muted">ЦО • '+r.items.length+' карт • '+(r.status==='submitted'?'Новая':r.status==='processing'?'В обработке':r.status==='completed'?'Завершена':'Отменена')+'</p></div>'+button('Открыть',"setView('request','"+r.id+"')")+'</div>').join(''):'<p class="muted">Заявок нет.</p>')+'</div>'}
function request(){let r=s.requests.find(x=>x.id===s.current);if(!r)return requests();let extracted=r.items.filter(x=>x.result==='extracted').length;let freeze=!!r.shipment,transit=r.phase==='transit';let rows=r.items.map((x,i)=>'<div class="item"><div><strong>'+x.id+'</strong><p class="muted">'+esc(x.name)+' • Коробка '+esc(x.box)+' • '+esc((s.boxes.find(b=>b.id===x.box)||{}).shelf||'Место на полке не указано')+'</p></div><div class="row">'+badge(x.result==='extracted'?'Готова к передаче':x.result==='not_found'?'Не найдена':x.result==='removed_by_archive'?'Исключена архивом':'Не обработана',x.result==='extracted'?'ok':'warn')+(r.status==='processing'&&!freeze&&!transit?'<select onchange="setResult(\''+r.id+'\','+i+',this.value);this.value=\'\'"><option value="">Изменить результат…</option><option value="not_found">Не найдена</option><option value="removed_by_archive">Исключена архивом</option><option value="extracted">Исправить: готова</option></select>':'')+'</div></div>').join('');let controls='';if(r.status==='submitted')controls=button('Начать обработку',"start('"+r.id+"')",true)+button('Отменить заявку',"cancelReq('"+r.id+"')");else if(r.status==='processing'&&!freeze)controls=extracted?button('Подготовить единое отправление ('+extracted+')',"prepare('"+r.id+"')",true):button('Завершить без отправления',"completeEmpty('"+r.id+"')",true);else if(r.status==='processing'&&r.phase==='draft')controls=button('Передать все карты курьеру',"handover('"+r.id+"')",true)+button('Отменить всю заявку',"cancelReq('"+r.id+"')");else if(transit)controls='<p class="muted">Все готовые карты переданы курьеру. Архив ожидает подтверждения получения в ЦО; повторная передача недоступна.</p>';return '<div class="panel">'+button('← К заявкам',"setView('requests')")+'<h1 style="margin-top:16px">Заявка № '+r.id+'</h1><p class="muted">ЦО → Архив (заявка на выдачу) • '+r.items.length+' карт • '+r.status+'</p>'+(r.status==='processing'?'<p>'+badge('Готовы: '+extracted+' / '+r.items.length,'ok')+(freeze?' '+badge('Список карт отправления утверждён'):'')+'</p>':'')+'<div class="row" style="margin:14px 0">'+button('Распечатать реестр карт',"printRequest('"+r.id+"')")+'</div><h2>Карты в заявке</h2>'+rows+'<div class="row" style="margin-top:16px">'+controls+'</div>'+(r.shipment?'<div class="sub"><h3 style="margin-top:0">Связанное отправление '+r.shipment+'</h3><p>Маршрут: архив → ЦО • Курьер: '+r.courier+'</p><p class="muted">В отправлении: все '+extracted+' готовых карт; изменить отдельные позиции нельзя.</p></div>':'')+'</div>'}
function start(id){modal('Начать обработку заявки','<p>Система отметит все карты заявки как готовые к передаче и учтёт их извлечение из коробок. Сотруднику ещё нужно найти и собрать карты. Курьеру они пока не передаются.</p>',()=>{let r=s.requests.find(x=>x.id===id);if(r.status!=='submitted')return false;r.status='processing';r.phase='review';r.items.forEach(x=>x.result='extracted');event(stamp(id+': начата обработка всех '+r.items.length+' позиций'));notify('Все позиции заявки извлечены в демонстрационной модели');return true})}
function setResult(id,i,result){if(!result)return;let r=s.requests.find(x=>x.id===id),x=r.items[i];if(r.status!=='processing'||r.shipment)return; if(result==='removed_by_archive'){modal('Исключить '+x.id,'<p>При исключении карта возвращается в коробку; причина обязательна при первом исключении.</p><div class="field"><label for="reason">Причина</label><textarea id="reason" placeholder="Обязательный комментарий"></textarea></div>',()=>{if(!$('reason').value.trim()){alert('Укажите причину');return false}x.result=result;event(stamp(id+' '+x.id+': исключена архивом'));notify('Результат изменён; история сохранена');return true})}else{modal('Изменить результат '+x.id,'<p>'+(result==='not_found'?'Указать «Не найдена»?':'Подтвердить повторное обнаружение и извлечение карты из коробки?')+'</p>',()=>{x.result=result;event(stamp(id+' '+x.id+': '+result));notify('Результат обновлён');return true})}}
function prepare(id){let r=s.requests.find(x=>x.id===id),ready=r.items.filter(x=>x.result==='extracted');if(!ready.length)return;modal('Подготовить отправление в ЦО','<p>Все карты заявки проверены. В отправление войдут <strong>все готовые карты ('+ready.length+')</strong>. Отправить только часть готовых карт нельзя. После создания черновика изменить результаты обработки будет нельзя.</p><div class="field"><label for="courier">Активный курьер</label><select id="courier"><option value="">Выберите курьера</option><option>Учебный курьер 1</option><option>Учебный курьер 2</option></select></div>',()=>{if(!$('courier').value){alert('Выберите курьера');return false}r.courier=$('courier').value;r.shipment='OUT-'+id;r.phase='draft';event(stamp(id+': создан единый черновик '+r.shipment));notify('Черновик создан. Состав зафиксирован; передача — отдельное действие.');return true})}
function handover(id){let r=s.requests.find(x=>x.id===id);modal('Передать карты курьеру','<p>Подтвердите передачу всех '+r.items.filter(x=>x.result==='extracted').length+' готовых карт курьеру. Передать только часть карт нельзя.</p>',()=>{if(r.phase!=='draft')return false;r.phase='transit';event(stamp(id+': единая передача всех готовых карт'));notify('Все карты переданы курьеру. Заявка остаётся в работе до приёмки ЦО.');return true})}
function cancelReq(id){modal('Отмена всей заявки '+id,'<p>До передачи курьеру можно отменить только всю заявку с обязательной причиной. История сохраняется.</p><div class="field"><label for="reason">Причина отмены</label><textarea id="reason"></textarea></div>',()=>{if(!$('reason').value.trim()){alert('Укажите причину');return false}let r=s.requests.find(x=>x.id===id);if(r.phase==='transit')return false;r.status='cancelled';r.phase='cancelled';r.shipment=null;event(stamp(id+': отменена вся заявка'));notify('Заявка отменена');return true})}
function completeEmpty(id){modal('Завершить без отправления','<p>Ни одна карта не готова к передаче. Завершить заявку без отправления?</p>',()=>{let r=s.requests.find(x=>x.id===id);if(r.items.some(x=>x.result==='extracted'))return false;r.status='completed';r.phase='done';event(stamp(id+': завершена без отправления'));notify('Заявка завершена без отправления');return true})}
function outgoing(){let list=s.requests.filter(r=>r.shipment);return '<div class="panel"><h1>Исходящие отправления в ЦО</h1><p class="muted">По каждой заявке — не более одного отправления, все готовые карты передаются одновременно.</p>'+(list.length?list.map(r=>'<div class="item"><div><strong>'+r.shipment+'</strong><p class="muted">Заявка '+r.id+' • '+r.courier+' • '+(r.phase==='transit'?'Передано ЦО через курьера':'Черновик')+'</p></div>'+button('Открыть заявку',"setView('request','"+r.id+"')")+'</div>').join(''):'<p class="muted">Пока нет отправлений. Создайте их из обработанной заявки ЦО.</p>')+'</div>'}

function reportBoxes(){return s.boxes.filter(b=>!b.transit&&b.shelf)}
function reportSections(){return [...new Set(s.shelves.map(x=>x.split(' / ')[0]))].sort()}
function reportShelfNames(sec){return s.shelves.filter(x=>!sec||x.startsWith(sec+' / '))}
function reportTableRows(){let q=s.reportQuery.trim().toLocaleLowerCase('ru');return s.boxes.filter(b=>!b.transit).filter(b=>!s.reportSection||b.shelf&&b.shelf.startsWith(s.reportSection+' / ')).filter(b=>!s.reportShelf||b.shelf===s.reportShelf).filter(b=>s.reportPlacement==='all'||(s.reportPlacement==='placed'?!!b.shelf:!b.shelf)).filter(b=>!q||[b.id,b.shelf||'',...(b.cards||[]).flatMap(c=>[c.id,c.name])].join(' ').toLocaleLowerCase('ru').includes(q))}
function reportSelect(name,opts,value){return '<select aria-label="'+name+'" onchange="'+(name==='Секция'?"s.reportSection=this.value;s.reportShelf='';":name==='Полка'?"s.reportShelf=this.value;":"s.reportPlacement=this.value;")+'render()">'+opts.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'}
function ruCount(n,one,few,many){let a=Math.abs(n)%100,b=a%10;return n+' '+(a>=11&&a<=14?many:b===1?one:b>=2&&b<=4?few:many)}
function occupancy(){let placed=reportBoxes(), sections=reportSections(), visible=reportTableRows();let sectionCards=sections.map(sec=>{let shelves=reportShelfNames(sec),boxes=placed.filter(b=>b.shelf.startsWith(sec+' / '));return '<div class="report-section"><div class="item"><div><strong>'+esc(sec)+'</strong><p class="muted">'+ruCount(shelves.length,'полка','полки','полок')+' · '+ruCount(boxes.length,'коробка','коробки','коробок')+' · '+ruCount(boxes.reduce((n,b)=>n+b.cards.length,0),'карта','карты','карт')+'</p></div>'+button(s.reportSection===sec?'Свернуть':'Открыть',"openReportSection('"+esc(sec)+"')")+'</div>'+(s.reportSection===sec?shelves.map(sh=>{let bs=placed.filter(b=>b.shelf===sh);return '<div class="report-shelf"><div class="item"><div><strong>'+esc(sh.split(' / ')[1])+'</strong><p class="muted">'+ruCount(bs.length,'коробка','коробки','коробок')+' · '+ruCount(bs.reduce((n,b)=>n+b.cards.length,0),'карта','карты','карт')+'</p></div>'+button(s.reportShelf===sh?'Свернуть':'Показать коробки',"openReportShelf('"+esc(sh)+"')")+'</div>'+(s.reportShelf===sh?'<div class="report-boxes">'+(bs.length?bs.map(b=>'<div class="report-box"><strong>'+esc(b.id)+'</strong><p class="muted">'+ruCount(b.cards.length,'карта','карты','карт')+'</p>'+button('Открыть коробку',"setView('box','"+esc(b.id)+"')")+'</div>').join(''):'<p class="muted">Коробок на полке нет.</p>')+'</div>':'')+'</div>'}).join(''):'')+'</div>'}).join('');return '<div class="panel"><h1>Загрузка архива</h1><p class="muted">Обзор размещения коробок и карт. Вместимость секций и полок не задана, поэтому процент заполнения не рассчитывается.</p><div class="grid"><div class="metric"><strong>'+sections.length+'</strong>'+ruCount(sections.length,'секция','секции','секций').split(' ').slice(1).join(' ')+ '</div><div class="metric"><strong>'+s.shelves.length+'</strong>'+ruCount(s.shelves.length,'полка','полки','полок').split(' ').slice(1).join(' ')+ '</div><div class="metric"><strong>'+placed.length+'</strong>'+ruCount(placed.length,'коробка','коробки','коробок').split(' ').slice(1).join(' ')+ ' на полках</div><div class="metric"><strong>'+placed.reduce((n,b)=>n+b.cards.length,0)+'</strong>'+ruCount(placed.reduce((n,b)=>n+b.cards.length,0),'карта','карты','карт').split(' ').slice(1).join(' ')+ ' на полках</div></div><div class="tabs" style="margin-top:18px">'+[['visual','Схема архива'],['table','Таблица']].map(([v,l])=>'<button class="'+(s.reportMode===v?'active':'')+'" onclick="s.reportMode=\''+v+'\';render()">'+l+'</button>').join('')+'</div>'+(s.reportMode==='visual'?'<p class="muted">Нажмите «Открыть» у секции, затем «Показать коробки» у полки.</p><div class="report-grid">'+sectionCards+'</div>':'<div class="report-filters"><label>Секция '+reportSelect('Секция',[['','Все секции'],...sections.map(x=>[x,x])],s.reportSection)+'</label><label>Полка '+reportSelect('Полка',[['','Все полки'],...reportShelfNames(s.reportSection).map(x=>[x,x])],s.reportShelf)+'</label><label>Размещение '+reportSelect('Размещение',[['all','Все'],['placed','На полках'],['unplaced','Без размещения']],s.reportPlacement)+'</label><label>Поиск <input placeholder="Коробка, карта или ФИО" value="'+esc(s.reportQuery)+'" oninput="s.reportQuery=this.value;updateReportTable()"></label></div><div id="report-table">'+reportTableHtml(visible)+'</div>')+'</div>'}
function reportTableHtml(rows){return '<p class="muted">Найдено коробок: '+rows.length+'</p><div class="table-wrap"><table class="report-table"><thead><tr><th>Секция</th><th>Полка</th><th>Коробка</th><th>Карт</th><th>Действие</th></tr></thead><tbody>'+(rows.length?rows.map(b=>'<tr><td>'+esc(b.shelf?b.shelf.split(' / ')[0]:'—')+'</td><td>'+esc(b.shelf?b.shelf.split(' / ')[1]:'Не размещена')+'</td><td>'+esc(b.id)+'</td><td>'+b.cards.length+'</td><td>'+button('Открыть',"setView('box','"+esc(b.id)+"')")+'</td></tr>').join(''):'<tr><td colspan="5">По заданным фильтрам коробок нет</td></tr>')+'</tbody></table></div>'}
function updateReportTable(){let el=$('report-table');if(el)el.innerHTML=reportTableHtml(reportTableRows())}
function openReportSection(sec){s.reportSection=s.reportSection===sec?'':sec;s.reportShelf='';render()}
function openReportShelf(sh){s.reportShelf=s.reportShelf===sh?'':sh;render()}
function printRequest(id){let r=s.requests.find(x=>x.id===id);if(!r)return;let old=$('print-sheet');if(old)old.remove();let sheet=document.createElement('section');sheet.id='print-sheet';let rows=r.items.map((x,i)=>{let b=s.boxes.find(y=>y.id===x.box);return '<tr><td>'+(i+1)+'</td><td>'+esc(x.id)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.box)+'</td><td>'+esc(b&&b.shelf?b.shelf:'Местонахождение не указано')+'</td><td>'+esc(x.result==='not_found'?'Не найдена':x.result==='removed_by_archive'?'Исключена':x.result==='extracted'?'Готова к передаче':'Не обработана')+'</td><td class="check-col"></td></tr>'}).join('');sheet.innerHTML='<h1>Реестр карт для поиска в архиве</h1><p><strong>Заявка '+esc(r.id)+'</strong> · Получатель: ЦО · Дата печати: '+new Date().toLocaleDateString('ru-RU')+'</p><table><thead><tr><th>№</th><th>Номер карты</th><th>ФИО пациента</th><th>Коробка</th><th>Расположение</th><th>Результат</th><th>Отметка</th></tr></thead><tbody>'+rows+'</tbody></table><p class="print-foot">Исполнитель: _____________________ &nbsp;&nbsp; Дата: _____________________</p>';document.body.appendChild(sheet);window.print()}

render();</script></body></html>
