<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МедАрхив — Аналитика v2</title><style>:root{font-family:Segoe UI,Arial,sans-serif;color:#233c4b;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}header{background:#153d52;color:white;padding:19px 25px;display:flex;justify-content:space-between}main{max-width:1320px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}nav,article{border:1px solid #d8e4e9;background:white;border-radius:13px;padding:20px;align-self:start;box-shadow:0 3px 10px #223b4c0a}button,input,select{font:inherit;border:1px solid #c0d1dc;border-radius:8px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer;color:#1b536d}button:hover,.active{background:#e2f3f5;border-color:#62afbb}.primary{background:#116d7b;color:white}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;min-height:46px}h1{font-size:25px;margin-top:0}h2{font-size:19px}small,p.hint{color:#667d8b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{text-align:left;padding:22px;min-height:90px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{text-align:left;border-bottom:1px solid #e5edf0;padding:11px 8px}th{font-size:13px;color:#667d8b}label{display:grid;gap:6px;max-width:460px;margin:14px 0}.tag{background:#eaf3f6;border-radius:20px;padding:5px 10px}.notice{background:#fff4df;padding:12px;border-radius:9px}.scroll{overflow:auto}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid #e5a852}@media(max-width:800px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{width:auto}header{flex-wrap:wrap}}/* Restore v1 visual tokens and home tiles. */
:root{font-family:'Segoe UI',Arial,sans-serif}h1{margin:0 0 15px}button.active{background:#e2f3f5;border-color:#62afbb;font-weight:700}button:hover{background:#edf6f8}button.active:hover{background:#e2f3f5}button.primary{background:#116d7b;color:white}nav,article{margin-bottom:16px}input,select{padding:9px}label{gap:5px;margin:12px 0}.tag{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid button.tile{display:block;width:100%;text-align:left;border:1px solid #d8e4e9;border-radius:11px;padding:20px;background:#f9fcfd;color:#233c4b;min-height:0}.grid button.tile:hover{background:#edf8fa}.tile p{margin:1em 0;color:#667d8b}header small{color:#d5e6ec} @media(max-width:800px){.grid{grid-template-columns:1fr}header{flex-direction:column;gap:10px}}

.metric{font-size:28px;font-weight:700;margin:9px 0}.tiles{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}.filters label{margin:0;flex:1;min-width:135px}.chart{display:flex;align-items:end;gap:12px;height:190px;padding:12px 0;border-bottom:1px solid #d8e4e9}.day{flex:1;text-align:center;min-width:0}.bars{height:145px;display:flex;align-items:end;justify-content:center;gap:5px}.bar{background:#116d7b;width:30%;min-width:12px;border-radius:4px 4px 0 0;position:relative}.bar.alt{background:#7599b0}.bar span{position:absolute;top:-19px;left:0;right:0;font-size:12px}.legend{display:inline-block;width:12px;height:12px;background:#116d7b;margin-right:5px}.altlegend{background:#7599b0}.tile.active{background:#e2f3f5!important;border-color:#62afbb!important}.crumb{color:#667d8b;font-size:14px;margin:12px 0}.sub{border:1px solid #d8e4e9;border-radius:11px;padding:16px;margin-top:16px}.link{border:0;padding:4px;background:transparent;text-decoration:underline}.filters input,.filters select{width:100%}header select{color:#233c4b} .muted{color:#667d8b} .storage-filters{align-items:flex-end}.storage-filters input,.storage-filters select,.storage-filters>button{height:39px}.storage-filters>button{flex-shrink:0}</style><header><div><b>МедАрхив</b> · Управленческая аналитика</div><small>UX-08-05 · интерактивный черновик v1 · демонстрационные данные</small></header><main><nav id="nav"></nav><article id="screen"></article></main><script>
const $=x=>document.getElementById(x), E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(t,f,c='')=>`<button class="${c}" onclick="${f}">${E(t)}</button>`, T=(h,r)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`, S=(label,id,opts,v,fn)=>`<label>${label}<select id="${id}" onchange="${fn}">${opts.map(([k,n])=>`<option value="${E(k)}" ${k===v?'selected':''}>${E(n)}</option>`).join('')}</select></label>`;
const sections=['А','Б','В'], shelves=sections.flatMap(s=>[1,2,3].map(n=>({s,id:s+'-0'+n,active:!(s==='В'&&n===3)})));let boxes=[];let idx=0;const names=['Алексеева Ольга Ивановна','Васильев Андрей Николаевич','Иванова Мария Петровна','Кузнецов Сергей Андреевич','Морозова Елена Викторовна','Орлов Виктор Павлович','Петров Алексей Игоревич','Смирнова Наталья Олеговна','Соколова Анна Сергеевна'];
function add(s,h,n){let id='BX-'+String(++idx).padStart(4,'0');boxes.push({id,s,h,cards:Array.from({length:n},(_,i)=>({id:String(idx*100+i+1).padStart(7,'0'),name:names[(idx+i)%names.length]})).sort((a,b)=>a.name.localeCompare(b.name,'ru'))})} shelves.filter(x=>x.active&&x.id!=='Б-03').forEach((h,i)=>{for(let j=0;j<3+i%3;j++)add(h.s,h.id,(i+j)%7===0?0:3+(i+j)%7)});for(let i=0;i<8;i++)add('','',4+i%4);
let page='analytics',mode='visual',sec='',shelf='',placement='',query='',box='',period='7',scope='all',role='admin',queue='',sort='id';
const allowed=()=>role==='admin'||role==='co_yes';function go(p){page=p;queue='';render()}function setRole(v){role=v;box='';queue='';render()}function filter(){return boxes.filter(b=>(!sec||b.s===sec)&&(!shelf||b.h===shelf)&&(!placement||(placement==='placed'?!!b.h:!b.h))&&b.id.toLowerCase().includes(query.toLowerCase()))}function setSec(v){sec=v;shelf='';box='';render()}function setShelf(v){shelf=v;box='';render()}function setPlace(v){placement=v;box='';render()}function openBox(v){box=v;render()}function pluralUnit(n,unit){const forms={'коробок':['коробка','коробки','коробок'],'карт':['карта','карты','карт'],'карты':['карта','карты','карт'],'заявок':['заявка','заявки','заявок'],'медицинских карт':['медицинская карта','медицинские карты','медицинских карт']};const [word,...rest]=unit.split(' · ');const f=forms[word];const k=n%100>=11&&n%100<=14?2:n%10===1?0:n%10>=2&&n%10<=4?1:2;return [f?f[k]:word,...rest].join(' · ')}function tile(title,n,unit,fn,active=false){return `<button class="tile ${active?'active':''}" onclick="${fn}"><b>${E(title)}</b><div class="metric">${n}</div><small>${E(pluralUnit(n,unit))}</small></button>`}
const queues={incoming:{title:'Ожидают приёмки',unit:'коробок',rows:Array.from({length:12},(_,i)=>['BX-IN-'+(101+i),i%2?'ЦО → Архив':'Филиал → Архив','Ожидает приёмки'])},requests:{title:'Заявки в работе',unit:'заявок',rows:Array.from({length:6},(_,i)=>['З-'+(201+i),'Центральный офис',i<2?'Новая':'В работе'])},receipt:{title:'Ожидают получения ЦО',unit:'карт',rows:Array.from({length:24},(_,i)=>['К-'+(301+i),'Архив → ЦО','Ожидает получения'])}};
function showQueue(k){queue=k;render()}function chart(a,b){let max=Math.max(...a,...(b||[]),1);return `<div class="chart" role="img" aria-label="Демонстрационная динамика">${a.map((n,i)=>`<div class="day"><div class="bars"><div class="bar" style="height:${n/max*82}%"><span>${n}</span></div>${b?`<div class="bar alt" style="height:${b[i]/max*82}%"><span>${b[i]}</span></div>`:''}</div><small>${period==='7'?['19.11','20.11','21.11','22.11','23.11','24.11','25.11'][i]:['Нед. 1','Нед. 2','Нед. 3','Нед. 4'][i]}</small></div>`).join('')}</div>`}
function analytics(){let a=period==='7'?[24,38,29,46,32,18,25]:[140,165,152,180], b=period==='7'?[30,42,26,48,35,20,28]:[180,155,190,172],c=period==='7'?[22,35,31,39,42,18,26]:[160,150,185,170];if(scope==='branch'){a=a.map(x=>Math.floor(x*.7));b=b.map(()=>0);c=c.map(()=>0)}if(scope==='co'){a=a.map(x=>Math.floor(x*.3))}let sum=x=>x.reduce((s,n)=>s+n,0);let q=queues[queue];return `<h1>Аналитика движения</h1><p class="hint">Текущие очереди и движение за период · учебные данные</p><h2>Требуют внимания сейчас</h2><div class="grid">${tile('Ожидают приёмки',12,'коробок',"showQueue('incoming')")}${tile('Коробки без размещения',boxes.filter(b=>!b.h).length,'коробок',"page='storage';sec='';shelf='';query='';placement='unplaced';mode='table';render()")}${tile('Заявки в работе',6,'заявок',"showQueue('requests')")}${tile('Ожидают получения ЦО',24,'карты',"showQueue('receipt')")}</div>${q?`<div class="sub"><div class="row"><h2>${q.title}</h2>${B('Закрыть',"showQueue('')")}</div>${T(['Номер','Маршрут / подразделение','Состояние'],q.rows)}</div>`:''}<h2>Движение за период</h2><div class="row filters">${S('Период','period',[['7','Последние 7 дней'],['30','Последние 30 дней']],period,'period=this.value;render()')}${S('Маршрут','scope',[['all','Все маршруты'],['branch','Филиал → Архив'],['co','ЦО ↔ Архив']],scope,'scope=this.value;render()')}</div><div class="grid tiles">${tile('Принято архивом',sum(a),'коробок',"document.getElementById('boxchart').scrollIntoView()")}${tile('Передано архивом',sum(b),'карт',"document.getElementById('cardchart').scrollIntoView()")}${tile('Получено ЦО',sum(c),'карт',"document.getElementById('cardchart').scrollIntoView()")}</div><div class="sub" id="boxchart"><h2>Поступление коробок</h2>${chart(a)}<p class="hint">Единица: коробка · событие: подтверждённая приёмка</p></div><div class="sub" id="cardchart"><h2>Передача и получение карт</h2><small><i class="legend"></i>Передано архивом &nbsp; <i class="legend altlegend"></i>Получено ЦО</small>${chart(b,c)}<p class="hint">Единица: карта · передача и получение учитываются отдельно</p></div>`}
function storage(){let f=filter(), chosen=boxes.find(b=>b.id===box);let rows=[...f].sort((a,b)=>sort==='count'?b.cards.length-a.cards.length:a.id.localeCompare(b.id));return `<h1>Хранение медицинских карт</h1><div class="row">${B('Визуально',"mode='visual';render()",mode==='visual'?'active':'')}${B('Табличный реестр',"mode='table';render()",mode==='table'?'active':'')}</div><div class="row filters storage-filters">${S('Секция','sec',[['','Все секции'],...sections.map(s=>[s,'Секция '+s])],sec,'setSec(this.value)')}${S('Полка','shelf',[['','Все полки'],...shelves.filter(h=>!sec||h.s===sec).map(h=>[h.id,h.id])],shelf,'setShelf(this.value)')}${S('Размещение','placement',[['','Все'],['placed','На полке'],['unplaced','Без размещения']],placement,'setPlace(this.value)')}<label>Номер коробки<input id="query" value="${E(query)}" oninput="query=this.value;box='';render(true)"></label>${B('Сбросить',"sec=shelf=placement=query=box='';render()")}</div><div class="grid tiles">${tile('На полках',f.filter(b=>b.h).length,'коробок',"setPlace('placed')")}${tile('Без размещения',f.filter(b=>!b.h).length,'коробок',"setPlace('unplaced')")}${tile('Карт в коробках',f.reduce((a,b)=>a+b.cards.length,0),'медицинских карт',"mode='table';render()")}</div><p class="hint">Физическая вместимость не определена. Итоги по текущей выборке.</p>${mode==='visual'?`<h2>Секции архива</h2><div class="grid tiles">${sections.filter(s=>!sec||s===sec).map(s=>tile('Секция '+s,f.filter(b=>b.s===s).length,'коробок',`setSec('${s}')`,sec===s)).join('')}</div><h2>Полки ${sec?'секции '+sec:''}</h2><div class="grid tiles">${shelves.filter(h=>(!sec||h.s===sec)&&(!shelf||h.id===shelf)).map(h=>tile('Полка '+h.id,f.filter(b=>b.h===h.id).length,h.active?'коробок · активна':'коробок · неактивна',`sec='${h.s}';setShelf('${h.id}')`,shelf===h.id)).join('')}</div><h2>Коробки ${shelf?'на полке '+shelf:''}</h2><div class="grid tiles">${rows.map(b=>tile(b.id,b.cards.length,'карт · '+(b.h||'без размещения'),`openBox('${b.id}')`,box===b.id)).join('')}</div>`:`<div class="row">${S('Сортировка','sort',[['id','По номеру коробки'],['count','По количеству карт']],sort,'sort=this.value;render()')}</div>${T(['Секция','Полка','Коробка','Карт внутри','Размещение'],rows.map(b=>[b.s||'—',b.h||'—',B(b.id,`openBox('${b.id}')`,'link'),b.cards.length,b.h?'На полке':'Без размещения']))}`}${!f.length?'<p class="notice">По выбранным фильтрам коробок нет.</p>':''}${chosen?`<div class="sub" id="detail"><div class="crumb">Архив / ${chosen.s?'Секция '+chosen.s+' / Полка '+chosen.h:'Без размещения'} / ${chosen.id}</div><div class="row"><h2>Коробка ${chosen.id}</h2>${B('Закрыть',"box='';render()")}</div><p>Медицинских карт: <b>${chosen.cards.length}</b></p>${chosen.cards.length?T(['Номер карты','ФИО'],chosen.cards.map(c=>[E(c.id),E(c.name)])):'<p class="hint">Коробка пуста.</p>'}</div>`:''}`}
function render(focus=false){$('nav').innerHTML=B('Аналитика движения',"go('analytics')",page==='analytics'?'active':'')+B('Хранение',"go('storage')",page==='storage'?'active':'')+'<hr><small>Проверка доступа (демо)</small>'+S('Роль','role',[['admin','Администратор'],['co_yes','ЦО — с правом'],['co_no','ЦО — без права'],['archive','Архив'],['branch','Филиал']],role,'setRole(this.value)');$('screen').innerHTML=allowed()?(page==='analytics'?analytics():storage()):'<h1>Доступ недоступен</h1><p class="notice">У выбранной роли нет полномочия на управленческие дашборды.</p><p class="hint">Это демонстрация ограничения, а не серверная авторизация.</p>';if(focus&&$('query')){$('query').focus();$('query').setSelectionRange(query.length,query.length)}else if(box&&$('detail'))$('detail').scrollIntoView({block:'nearest'});}render();</script></html>
