[project]
name = "medarchive"
version = "0.1.0"
description = "Система управления архивом медицинских карт"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",  # Form-данные в FastAPI
    "aiosqlite>=0.20.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4 несовместим с bcrypt>=4.1
    "itsdangerous>=2.1.0",
    "qrcode[pil]>=7.4.0",  # QR-коды полок (Task 5-QR)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
