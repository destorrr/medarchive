{% extends "base.html" %}
{% block content %}
<h1>🏢 Филиалы</h1>
<div class="card">
    <h2 style="font-size:16px; margin-bottom:12px;">Создать филиал</h2>
    <form method="post" action="/admin/branches">
        <input type="text" name="name" placeholder="Название" required>
        <input type="text" name="code" placeholder="Код" required>
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
</div>
<div class="card">
    <table>
        <thead><tr><th>ID</th><th>Название</th><th>Код</th><th>Действия</th></tr></thead>
        <tbody>
        {% for b in branches %}
        <tr>
            <td>{{ b.id }}</td>
            <td><input type="text" name="name" value="{{ b.name }}" form="edit-branch-{{ b.id }}" required></td>
            <td><input type="text" name="code" value="{{ b.code }}" form="edit-branch-{{ b.id }}" required></td>
            <td>
                <button type="submit" form="edit-branch-{{ b.id }}" class="btn btn-primary">Сохранить</button>
                <form id="edit-branch-{{ b.id }}" method="post" action="/admin/branches/{{ b.id }}/edit" style="display:none"></form>
                <form method="post" action="/admin/branches/{{ b.id }}/delete" style="display:inline"
                      onsubmit="return confirm('Удалить филиал «{{ b.name }}»?');">
                    <button type="submit" class="btn">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
