{% extends "base.html" %}
{% block content %}
<h1>🚚 Курьеры</h1>
<div class="card">
    <h2 style="font-size:16px; margin-bottom:12px;">Добавить курьера</h2>
    <form method="post" action="/admin/couriers">
        <input type="text" name="name" placeholder="ФИО" required>
        <input type="text" name="phone" placeholder="Телефон">
        <button type="submit" class="btn btn-primary">Добавить</button>
    </form>
</div>
<div class="card">
    <table>
        <thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Действия</th></tr></thead>
        <tbody>
        {% for c in couriers %}
        <tr>
            <td>{{ c.id }}</td>
            <td><input type="text" name="name" value="{{ c.name }}" form="edit-courier-{{ c.id }}" required></td>
            <td><input type="text" name="phone" value="{{ c.phone or '' }}" form="edit-courier-{{ c.id }}"></td>
            <td>
                <button type="submit" form="edit-courier-{{ c.id }}" class="btn btn-primary">Сохранить</button>
                <form id="edit-courier-{{ c.id }}" method="post" action="/admin/couriers/{{ c.id }}/edit" style="display:none"></form>
                <form method="post" action="/admin/couriers/{{ c.id }}/delete" style="display:inline"
                      onsubmit="return confirm('Удалить курьера «{{ c.name }}»?');">
                    <button type="submit" class="btn">Удалить</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" style="text-align:center; color:#888;">Курьеров пока нет</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
