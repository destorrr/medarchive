{% extends "base.html" %}
{% block content %}
<h1>🏢 Филиалы</h1>
<div class="card">
    <h2 style="font-size:16px; margin-bottom:12px;">Создать филиал</h2>
    <form method="post" action="/admin/branches">
        <input type="text" name="code" placeholder="Код филиала" maxlength="64" required>
        <input type="text" name="name" placeholder="Название филиала" maxlength="255" required>
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
</div>
<div class="card">
    <table>
        <thead><tr><th>Код</th><th>Название</th><th>Статус</th><th>Действия</th></tr></thead>
        <tbody>
        {% for b in branches %}
        <tr>
            <td><input type="text" name="code" value="{{ b.code }}" form="branch-{{ b.id }}" required></td>
            <td><input type="text" name="name" value="{{ b.name }}" form="branch-{{ b.id }}" required></td>
            <td>{{ "Активен" if b.is_active else "Отключён" }}</td>
            <td>
                <form id="branch-{{ b.id }}" method="post" action="/admin/branches/{{ b.id }}/edit" style="display:inline">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>
                <form method="post" action="/admin/branches/{{ b.id }}/status" style="display:inline">
                    <input type="hidden" name="is_active" value="{{ 'false' if b.is_active else 'true' }}">
                    <button type="submit" class="btn">{{ "Отключить" if b.is_active else "Восстановить" }}</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">Филиалов пока нет.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
