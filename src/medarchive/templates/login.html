<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Вход — МедАрхив</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
    <main class="login-layout">
        <a class="login-brand" href="/login" aria-label="МедАрхив — страница входа">
            <span class="login-brand-mark" aria-hidden="true">М</span>
            <span><strong>МедАрхив</strong><small>Учёт медицинских карт</small></span>
        </a>
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-card-header">
                <p class="eyebrow">Рабочая система организации</p>
                <h1 id="login-title">Вход в систему</h1>
                <p class="page-description">Введите учётные данные, чтобы продолжить работу.</p>
            </header>
            {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
            <form method="post" action="/login" class="login-form">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary login-submit">Войти</button>
            </form>
        </section>
        <p class="login-footer">Доступ предоставляется администратором медицинской организации.</p>
    </main>
</body>
</html>
