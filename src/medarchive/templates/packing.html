{% extends "base.html" %}
{% block content %}
{% include "packing_fragment.html" %}
{% endblock %}
{% block scripts %}
<script>
    // Auto-focus scanner after HTMX swaps
    document.body.addEventListener('htmx:afterSwap', function() {
        var input = document.querySelector('input[autofocus]');
        if (input) { input.focus(); }
    });
</script>
{% endblock %}
