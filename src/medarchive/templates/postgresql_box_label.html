{% extends "base.html" %}
{% block content %}
<div class="card box-label-screen">
    <div class="box-label">
        <div class="box-label-title">МедАрхив · транспортная коробка</div>
        <img src="{{ qr_data_uri }}" alt="QR-код коробки {{ box.box_number }}" width="240" height="240">
        <div class="box-label-number">{{ box.box_number }}</div>
        <div class="box-label-location">{{ location.name }}</div>
        <div class="box-label-hint">QR-код содержит идентификатор коробки, без данных пациентов</div>
    </div>
    <div class="box-label-actions">
        <button class="btn btn-primary" type="button" onclick="window.print()">Печать этикетки</button>
        <button class="btn" type="button" onclick="history.back()">Назад</button>
    </div>
</div>
<style>
.box-label-screen { max-width: 520px; margin: 0 auto; }
.box-label { width: 100%; max-width: 360px; margin: 0 auto; padding: 18px; border: 1px solid #222; border-radius: 8px; text-align: center; color: #111; }
.box-label-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.box-label img { display: block; width: 240px; height: 240px; margin: 0 auto 10px; }
.box-label-number { font-size: 24px; font-weight: 800; letter-spacing: .5px; overflow-wrap: anywhere; }
.box-label-location { margin-top: 4px; font-size: 13px; }
.box-label-hint { margin-top: 10px; font-size: 10px; color: #555; }
.box-label-actions { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
@media print {
    @page { size: 100mm 100mm; margin: 5mm; }
    body { display: block !important; background: #fff !important; }
    .sidebar, .box-label-actions { display: none !important; }
    .main { padding: 0 !important; }
    .box-label-screen { margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
    .box-label { max-width: none; width: 90mm; border: 1px solid #222; border-radius: 0; padding: 5mm; }
}
</style>
{% endblock %}
