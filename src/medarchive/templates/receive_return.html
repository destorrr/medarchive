{% extends "base.html" %}
{% block content %}
<h1>📥 Приём возврата</h1>

<div class="card" style="margin-bottom:16px">
    <p style="color:#666;margin-bottom:12px">
        Отсканируйте QR-код возвращаемой карты или введите её ID.
    </p>
    <form method="post" action="/receive-return/confirm">
        <label style="display:block;font-weight:600;margin-bottom:4px">Сканер (ID карты):</label>
        <input type="text" name="card_id" autofocus
               style="width:100%;padding:10px;border:2px solid #ddd;border-radius:6px;font-size:16px"
               placeholder="Отсканируйте QR или введите ID карты...">
        <button type="submit" class="btn btn-primary" style="margin-top:12px">✅ Подтвердить получение</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
    // Возврат фокуса в поле сканера после отправки формы
    var input = document.querySelector('input[autofocus]');
    if (input) { input.focus(); }
</script>
{% endblock %}
