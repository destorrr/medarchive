{% extends "base.html" %}
{% block content %}
<h1>📝 Новая заявка на возврат</h1>
<style>
    /* Страница /requests/new — живой поиск (макет v5, экран 1; задача 3
       раунда 2): крупный инпут как в /search, без кнопки «Найти» и без
       подсказки про филиал; результаты — htmx-фрагмент /requests/new/search
       в #results по мере ввода. Базовые стили (.card, .badge-*, .btn) — в
       base.html; здесь локальные для страницы и фрагмента. */
    .search-box { display: flex; gap: 8px; align-items: center; }
    .search-box input {
        flex: 1; padding: 12px 14px; border: 2px solid #ddd; border-radius: 8px;
        font: inherit; font-size: 16px; outline: none; background: #fff; color: #1a1a2e;
    }
    .search-box input:focus { border-color: #e94560; }
    .search-box input::placeholder { color: #aaa; }
    .search-hint { margin-top: 8px; font-size: 12px; color: #888; }
    .card h3 { font-size: 15px; margin-bottom: 10px; color: #1a1a2e; }
    .card h3 .muted { font-weight: 400; }

    /* Строка результата (макет v5, экран 1/1б): слева ФИО + статус-бейдж,
       справа кнопка «Запросить» или текст guard-состояния */
    .row-hit { display: flex; align-items: center; gap: 14px; padding: 10px 2px; border-bottom: 1px solid #f0f0f0; }
    .row-hit:last-child { border-bottom: none; }
    .row-hit .hit-main { flex: 1; min-width: 0; }
    .row-hit .hit-note { margin-top: 3px; }
    .row-hit .hit-state { font-size: 13px; color: #888; white-space: nowrap; }
    .row-hit .hit-state a { color: #1a1a2e; }

    /* Пустые состояния (idle / ничего не найдено) */
    .empty-state { text-align: center; padding: 24px 16px; }
    .empty-state .icon { font-size: 30px; margin-bottom: 8px; }
    .empty-state p { color: #666; }
    .empty-state .hint { margin-top: 6px; font-size: 12px; color: #999; }
</style>

<div class="card">
    <div class="form-group">
        <label for="request-q">Поиск карты (ФИО)</label>
        <div class="search-box">
            <input type="text" id="request-q" name="query"
                   placeholder="Фамилия или ФИО…" autocomplete="off" autofocus
                   hx-get="/requests/new/search"
                   hx-trigger="input changed delay:350ms, search"
                   hx-target="#results" hx-swap="innerHTML">
        </div>
        <div class="search-hint">Результаты обновляются по мере ввода · поиск без учёта регистра</div>
    </div>
</div>
<div id="results">
    {% include "request_new_results.html" %}
</div>
{% endblock %}
{% block scripts %}
<script>
    // Возврат фокуса в поле поиска при загрузке страницы (после флеш-ошибки)
    var input = document.getElementById('request-q');
    if (input) { input.focus(); }
</script>
{% endblock %}
