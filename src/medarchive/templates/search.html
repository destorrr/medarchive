{% extends "base.html" %}
{% block content %}
<h1>🔍 Поиск по архиву</h1>
<div class="card">
    <form method="get" action="/search">
        <input type="text" name="query" value="{{ query }}"
               placeholder="ФИО или номер коробки…" autofocus
               style="width:100%;padding:10px 12px;font-size:16px;margin-bottom:8px;">
        <button type="submit" class="btn btn-primary">Найти</button>
    </form>
    <p style="color:#888;font-size:12px;">результаты по мере ввода · Esc очистить · поиск без учёта регистра</p>
</div>
<div id="search-results">
    {% include "search_fragment.html" %}
</div>
{% endblock %}
