{% extends "base.html" %}
{% block content %}
<h1>🚚 Передача курьеру</h1>
<div class="card">
    <form method="post" action="/transfer/confirm">
        <div class="form-group">
            <label for="box_id">Коробка</label>
            <div class="dd">
                <select class="dd-select" name="box_id" id="box_id">
                    <option value="">— Выберите —</option>
                    {% for box in ready_boxes %}
                    <option value="{{ box.id }}" {% if selected_box_id == box.id %}selected{% endif %}>
                        {{ box.box_number }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="courier_id">Курьер</label>
            <div class="dd">
                <select class="dd-select" name="courier_id" id="courier_id">
                    <option value="">— Выберите —</option>
                    {% for c in couriers %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Передать курьеру</button>
    </form>
</div>
{% endblock %}
